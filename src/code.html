                        const shieldAuraSlow = player.relics.includes('Ice Shield') && dist <= 200 ? getIceShieldSlowMultiplier() : 1;
                        const blizzardSlow = enemy.blizzardSlowTimer > 0 ? 0.7 : 1;
                        const slowMultiplier = (enemy.slowTimer > 0 ? 1 - (enemy.slowAmount || 0.5) : 1) *
                            (1 - (enemy.iceSlow || 0)) *
                            blizzardSlow *
                            shieldAuraSlow;
                        if (shouldChasePlayer) {
                            enemy.x += (dx / dist) * enemy.speed * slowMultiplier * dt;
                            enemy.y += (dy / dist) * enemy.speed * slowMultiplier * dt;
                        } else {
                            const steerX = Math.max(-1, Math.min(1, dx / ENEMY_CHASE_RADIUS)) * ENEMY_ADVANCE_STEER;
                            const advanceMag = Math.sqrt(steerX * steerX + 1);
                            enemy.x += (steerX / advanceMag) * enemy.speed * slowMultiplier * dt;
                            enemy.y += (1 / advanceMag) * enemy.speed * slowMultiplier * dt;
                        }
                    }
                    
                    // Update bleeding
                    if (enemy.bleedingTimer > 0) {
                        enemy.bleedingTimer -= dt;
                        const bleedDamage = enemy.maxHp * 0.03 * dt;
                        enemy.hp -= bleedDamage;
                    }
                    if (enemy.fireBurnTimer > 0) {
                        enemy.fireBurnTimer -= dt;
                        enemy.hp -= 1 * dt;
                    }
                    if (enemy.slowTimer > 0) {
                        enemy.slowTimer -= dt;
                    }
                    if (enemy.iceSlowTimer > 0) {
                        enemy.iceSlowTimer -= dt;
                        if (enemy.iceSlowTimer <= 0) {
                            enemy.iceSlow = 0;
                            enemy.iceSlowTimer = 0;
                        }
                    }
                    if (enemy.blizzardSlowTimer > 0) {
                        enemy.blizzardSlowTimer -= dt;
                    }
                    if (enemy.attackCooldown > 0) {
                        enemy.attackCooldown -= dt;
                    }
                    if (enemy.hurtTimer > 0) {
                        enemy.hurtTimer -= dt;
                    }
                    if (enemy.attackAnimTimer > 0) {
                        enemy.attackAnimTimer -= dt;
                    }
                    if (enemy.eliteId === 'S2' && enemy.hp <= enemy.maxHp * 0.5) {
                        enemy.fireNodeCooldown -= dt;
                        if (enemy.fireNodeCooldown <= 0) {
                            createFireNode(player.x, player.y);
                            enemy.fireNodeCooldown = 2 + Math.random();
                        }
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0 && !enemies[i].pendingDeath) {
                        killEnemy(enemies[i]);
                        enemies.splice(i, 1);
                    }
                }

                // Update bullets
                for (const bullet of bullets) {
                    if (bullet.type === 'heroSlash') {
                        bullet.lifetime -= dt;
                        bullet.x = player.x;
                        bullet.y = player.y;
                    } else {
                        bullet.x += bullet.vx * dt;
                        bullet.y += bullet.vy * dt;
                    }
                }

                // Remove off-screen bullets and expired slashes
                bullets = bullets.filter(b => {
                    if (b.type === 'heroSlash') {
                        return b.lifetime > 0;
                    }
                    return b.x >= -50 && b.x <= ARENA_WIDTH + 50 &&
                           b.y >= -50 && b.y <= ARENA_HEIGHT + 50;
                });

                for (const pickup of pickups) {
                    if (pickup.type === 'relic') continue;
                    if (pickup.lifetime == null) {
                        pickup.lifetime = PICKUP_LIFETIME;
                        pickup.maxLifetime = PICKUP_LIFETIME;
                    }
                    pickup.lifetime -= dt;
                }
                pickups = pickups.filter(pickup => pickup.type === 'relic' || pickup.lifetime > 0);

                // Update pickups with Gravity Glove attraction
                for (const pickup of pickups) {
                    if (player.relics.includes('Gravity Glove')) {
                        const dx = player.x - pickup.x;
                        const dy = player.y - pickup.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < getPickupAttractionRadius() && dist > 0) {
                            const speed = 200;
                            pickup.x += (dx / dist) * speed * dt;
                            pickup.y += (dy / dist) * speed * dt;
                        }
                    }
                }

                // Update floating combat text
                for (const floatingText of floatingTexts) {
                    floatingText.lifetime -= dt;
                    floatingText.y -= 38 * dt;
                }
                floatingTexts = floatingTexts.filter(floatingText => floatingText.lifetime > 0);

                // Update magic shield break visual effects
                for (const effect of shieldBreakEffects) {
                    effect.lifetime -= dt;
                }
                shieldBreakEffects = shieldBreakEffects.filter(effect => effect.lifetime > 0);

                if (player.burnTimer > 0) {
                    player.burnTimer -= dt;
                    player.burnTickTimer += dt;
                    if (player.burnTickTimer >= 1) {
                        player.burnTickTimer -= 1;
                        player.hp -= 5;
                        player.lastDamageTime = gameTime;
                        playPlayerAction(player.hp <= 0 ? 'death' : 'hurt');
                        if (player.hp <= 0 && tryReviveOrDie()) return;
                    }
                } else {
                    player.burnTickTimer = 0;
                }

                for (const hazard of fireHazards) {
                    hazard.delay -= dt;
                    if (hazard.delay <= 0 && !hazard.exploded) {
                        hazard.exploded = true;
                        fireExplosions.push({
                            x: hazard.x,
                            y: hazard.y,
                            radius: hazard.radius,
                            lifetime: 0.55,
                            maxLifetime: 0.55
                        });
                        const dx = player.x - hazard.x;
                        const dy = player.y - hazard.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist <= hazard.radius) {
                            let damage = 20;
                            if (player.relics.includes('Magic Shield')) {
                                const shieldBeforeHit = player.magicShield;
                                const shieldAbsorb = Math.min(player.magicShield, damage);
                                player.magicShield -= shieldAbsorb;
                                damage -= shieldAbsorb;
                                player.lastDamageTime = gameTime;
                                if (player.relicUpgrades.magicShield && shieldBeforeHit > 0 && player.magicShield <= 0) {
                                    triggerMagicShieldBreak();
                                }
                            }
                            player.hp -= damage;
                            player.invulnerableTimer = INVULNERABILITY_TIME;
                            if (player.hp <= 0) {
                                if (tryReviveOrDie()) return;
                            } else {
                                playPlayerAction('hurt');
                            }
                        }
                    }
                }
                fireHazards = fireHazards.filter(hazard => !hazard.exploded);

                for (const explosion of fireExplosions) {
                    explosion.lifetime -= dt;
                }
                fireExplosions = fireExplosions.filter(explosion => explosion.lifetime > 0);

                for (const deathEffect of enemyDeathEffects) {
                    deathEffect.lifetime -= dt;
                }
                enemyDeathEffects = enemyDeathEffects.filter(deathEffect => deathEffect.lifetime > 0);

                // Update blizzards
                for (const blizzard of blizzards) {
                    blizzard.lifetime -= dt;
                    blizzard.tickTimer += dt;
                    blizzard.angle += dt * 2.8;

                    for (const enemy of enemies) {
                        const dx = enemy.x - blizzard.x;
                        const dy = enemy.y - blizzard.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist <= blizzard.radius) {
                            enemy.blizzardSlowTimer = Math.max(enemy.blizzardSlowTimer || 0, 0.2);
                        }
                    }

                    if (blizzard.tickTimer >= 0.5) {
                        blizzard.tickTimer -= 0.5;
                        for (let i = enemies.length - 1; i >= 0; i--) {
                            const dx = enemies[i].x - blizzard.x;
                            const dy = enemies[i].y - blizzard.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist <= blizzard.radius) {
                                markEnemyHit(enemies[i]);
                                enemies[i].hp -= 1;
                                if (enemies[i].hp <= 0) {
                                    killEnemy(enemies[i]);
                                    enemies.splice(i, 1);
                                }
                            }
                        }
                    }
                }
                blizzards = blizzards.filter(blizzard => blizzard.lifetime > 0);

                // Bullet-enemy collisions
                const bulletsToRemove = new Set();
                const enemiesToRemove = new Set();

                for (let i = 0; i < bullets.length; i++) {
                    for (let j = 0; j < enemies.length; j++) {
                        if (enemiesToRemove.has(j)) continue;
                        
                        let hit = false;
                        let damage = 0;
                        
                        if (bullets[i].type === 'heroSlash') {
                            // Hero slash hits all enemies within radius
                            const dx = enemies[j].x - bullets[i].x;
                            const dy = enemies[j].y - bullets[i].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < bullets[i].radius + ENEMY_RADIUS * (enemies[j].sizeScale || 1)) {
                                hit = true;
                                damage = bullets[i].damage;
                            }
                        } else if (circleCollision(
                            bullets[i].x, bullets[i].y, bullets[i].big ? BULLET_RADIUS * 1.8 : BULLET_RADIUS,
                            enemies[j].x, enemies[j].y, ENEMY_RADIUS * (enemies[j].sizeScale || 1)
                        )) {
                            hit = true;
                            if (bullets[i].type === 'fireball') {
                                createFireExplosion(bullets[i].x, bullets[i].y, bullets[i].big ? 200 : 100, 2);
                                bulletsToRemove.add(i);
                                continue;
                            } else if (bullets[i].type === 'normal') {
                                damage = bullets[i].isCritical ? player.criticalDamage : 1;
                                if (player.relics.includes('Ice Blade')) {
                                    const previousIceSlow = enemies[j].iceSlow || 0;
                                    enemies[j].iceSlow = Math.min(getIceBladeMaxSlow(), previousIceSlow + 0.2);
                                    enemies[j].iceSlowTimer = 2;
                                    if (player.relicUpgrades.iceBlade && previousIceSlow < 1 && enemies[j].iceSlow >= 1) {
                                        triggerIceBladeBurst(enemies[j]);
                                    }
                                }
                            } else if (bullets[i].type === 'blackRod') {
                                damage = 1;
                                enemies[j].bleedingTimer = 3.0;
                            }
                        }
                        
                        if (hit) {
                            markEnemyHit(enemies[j]);
                            enemies[j].hp -= damage;
                            
                            // Black rods pierce through
                            if (bullets[i].type !== 'blackRod' && bullets[i].type !== 'heroSlash') {
                                bulletsToRemove.add(i);
                            }
                            
                            if (enemies[j].hp <= 0) {
                                enemiesToRemove.add(j);
                                killEnemy(enemies[j]);
                            }
                        }
                    }
                }

                bullets = bullets.filter((_, i) => !bulletsToRemove.has(i));
                enemies = enemies.filter((_, i) => !enemiesToRemove.has(i));

                // Pickup collection
                const pickupsToRemove = new Set();
                for (let i = 0; i < pickups.length; i++) {
                    const pickupCollectionRadius = pickups[i].type === 'relic'
                        ? PICKUP_RADIUS * 2
                        : PICKUP_RADIUS;
                    if (circleCollision(
                        player.x, player.y, PLAYER_RADIUS,
                        pickups[i].x, pickups[i].y, pickupCollectionRadius
                    )) {
                        if (pickups[i].type === 'health') {
                            if (player.relicUpgrades.fireHeart) {
                                player.maxHp += 2;
                            }
                            const healAmount = Math.max(1, Math.ceil(player.maxHp * 0.1));
                            const actualHeal = Math.min(healAmount, player.maxHp - player.hp);
                            player.hp = Math.min(player.hp + healAmount, player.maxHp);
                            if (actualHeal > 0) {
                                floatingTexts.push({
                                    x: pickups[i].x,
                                    y: pickups[i].y,
                                    text: `+${Math.ceil(actualHeal)}`,
                                    color: '#2ecc71',
                                    lifetime: 0.3,
                                    maxLifetime: 0.3
                                });
                            }
                        } else if (pickups[i].type === 'exp') {
                            addExp(pickups[i].value);
                        } else if (pickups[i].type === 'relic') {
                            activateRelic(pickups[i].relicName);
                        }
                        pickupsToRemove.add(i);
                    }
                }
                pickups = pickups.filter((_, i) => !pickupsToRemove.has(i));

                // Player-enemy collisions
                if (player.invulnerableTimer <= 0) {
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        if (!enemies[i] || enemies[i].pendingDeath) continue;
                        const dx = enemies[i].x - player.x;
                        const dy = enemies[i].y - player.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const attackRange = enemies[i].attackRange || NORMAL_ENEMY_ATTACK_RANGE;
                        if (dist <= attackRange) {
                            if (enemies[i].attackCooldown > 0) {
                                continue;
                            }
                            enemies[i].attackAnimTimer = 0.22;
                            enemies[i].facing = getEnemyFacingTowardPlayer(enemies[i], player.x - enemies[i].x);
                            let damage = config.enemyDamage + (enemies[i].damageBonus || 0);
                            let shieldBroken = false;
                            
                            // Magic Shield absorbs damage first
                            if (player.relics.includes('Magic Shield')) {
                                const shieldBeforeHit = player.magicShield;
                                const shieldAbsorb = Math.min(player.magicShield, damage);
                                player.magicShield -= shieldAbsorb;
                                damage -= shieldAbsorb;
                                player.lastDamageTime = gameTime;
                                shieldBroken = player.relicUpgrades.magicShield && shieldBeforeHit > 0 && player.magicShield <= 0;
                            }
                            
                            player.hp -= damage;
                            player.invulnerableTimer = INVULNERABILITY_TIME;
                            player.lastDamageTime = gameTime;
                            if (player.relics.includes('Fire Armor')) {
                                enemies[i].fireBurnTimer = Math.max(enemies[i].fireBurnTimer || 0, 3);
                                if (player.relicUpgrades.fireArmor) {
                                    player.fireArmorHasteTimer = 3;
                                }
                            }
                            if (enemies[i].eliteId === 'S2') {
                                player.burnTimer = 3;
                                player.burnTickTimer = 0;
                            }
                            enemies[i].attackCooldown = ENEMY_ATTACK_COOLDOWN;
                            if (shieldBroken) {
                                triggerMagicShieldBreak();
                            }

                            if (player.hp <= 0) {
                                if (tryReviveOrDie()) break;
                            } else {
                                playPlayerAction('hurt');
                            }
                        }
                    }
                }
                enemies = enemies.filter(enemy => !enemy.pendingDeath);

                updateUI();
            }

            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function getHeroSwordChargeStats(chargeTime) {
                const chargeConfig = getHeroSwordChargeConfig();
                const chargeRatio = Math.max(0, Math.min(1, (chargeTime - chargeConfig.min) / (chargeConfig.max - chargeConfig.min)));
                const firstHalf = chargeRatio <= 0.5;
                const localRatio = firstHalf ? chargeRatio / 0.5 : (chargeRatio - 0.5) / 0.5;
                const damage = firstHalf ? lerp(1, 2, localRatio) : lerp(2, 4, localRatio);
                const radius = firstHalf ? lerp(120, 180, localRatio) : lerp(180, 240, localRatio);
                const tier = chargeRatio < 0.33 ? 'small' : (chargeRatio < 0.67 ? 'medium' : 'large');

                return {
                    chargeRatio,
                    radius,
                    damage,
                    tier
                };
            }

            // Trigger Hero Sword slash
            function triggerHeroSwordSlash() {
                playPlayerAction('attack');
                const slashStats = getHeroSwordChargeStats(player.heroSwordChargeTime);
                
                // Create slash projectile with swing animation
                bullets.push({
                    x: player.x,
                    y: player.y,
                    type: 'heroSlash',
                    radius: slashStats.radius,
                    damage: Math.ceil(slashStats.damage),
                    tier: slashStats.tier,
                    lifetime: 0.2,
                    maxLifetime: 0.2,
                    swingAngle: Math.random() * Math.PI * 2,
                    swingSpeed: 20
                });
                
                player.heroSwordLastSlashTime = gameTime;
                player.heroSwordChargeTime = 0;
            }

            function drawScrollingArenaBackground() {
                const terrainSpeed = 72;
                const tileSize = 512;
                const borderWidth = 160;
                const scroll = (gameTime * terrainSpeed) % 96;
                const tileScroll = (gameTime * terrainSpeed) % tileSize;

                ctx.fillStyle = '#141529';
                ctx.fillRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);

                const centerTile = terrainSprites.center;
                if (centerTile && centerTile.complete && centerTile.naturalWidth > 0) {
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    for (let y = -tileSize + tileScroll; y < ARENA_HEIGHT + tileSize; y += tileSize) {
                        for (let x = -tileSize; x < ARENA_WIDTH + tileSize; x += tileSize) {
                            ctx.drawImage(centerTile, x, y, tileSize, tileSize);
                        }
                    }
                    ctx.restore();
                }

                ctx.save();
                if (!centerTile || !centerTile.complete || centerTile.naturalWidth <= 0) {
                    ctx.globalAlpha = 0.42;
                    ctx.strokeStyle = 'rgba(90, 105, 140, 0.22)';
                    ctx.lineWidth = 1;
                    for (let y = -96 + scroll; y < ARENA_HEIGHT + 96; y += 96) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(ARENA_WIDTH, y);
                        ctx.stroke();
                    }

                    ctx.globalAlpha = 0.28;
                    ctx.strokeStyle = 'rgba(50, 190, 220, 0.18)';
                    for (let y = -48 + scroll; y < ARENA_HEIGHT + 96; y += 192) {
                        ctx.beginPath();
                        ctx.moveTo(40, y);
                        ctx.lineTo(ARENA_WIDTH - 40, y + 36);
                        ctx.stroke();
                    }
                }

                ctx.globalAlpha = 0.5;
                ctx.fillStyle = 'rgba(120, 230, 255, 0.18)';
                for (let i = 0; i < 34; i++) {
                    const x = (i * 137) % ARENA_WIDTH;
                    const y = (i * 211 + scroll * (0.7 + (i % 3) * 0.25)) % ARENA_HEIGHT;
                    ctx.fillRect(x, y, 2, 2);
                }
                ctx.restore();

                const sideBorder = terrainSprites.border;
                if (sideBorder && sideBorder.complete && sideBorder.naturalWidth > 0) {
                    const borderScroll = (gameTime * terrainSpeed) % tileSize;
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    for (let y = -tileSize + borderScroll; y < ARENA_HEIGHT + tileSize; y += tileSize) {
                        ctx.drawImage(sideBorder, 0, y, borderWidth, tileSize);
                        ctx.save();
                        ctx.translate(ARENA_WIDTH, y);
                        ctx.scale(-1, 1);
                        ctx.drawImage(sideBorder, 0, 0, borderWidth, tileSize);
                        ctx.restore();
                    }
                    ctx.restore();
                }

                const sideDetail = terrainSprites.detail;
                if (sideDetail && sideDetail.complete && sideDetail.naturalWidth > 0) {
                    const detailScroll = gameTime * terrainSpeed * 0.9;
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    for (let i = 0; i < 9; i++) {
                        const y = ((i * 173 + detailScroll) % (ARENA_HEIGHT + 256)) - 128;
                        const leftX = 18 + (i % 3) * 18;
                        ctx.drawImage(sideDetail, leftX, y, 64, 64);
                        ctx.save();
                        ctx.translate(ARENA_WIDTH - leftX, y);
                        ctx.scale(-1, 1);
                        ctx.drawImage(sideDetail, 0, 0, 64, 64);
                        ctx.restore();
                    }
                    ctx.restore();
                }
            }

            // Render game
            function render() {
                const scale = getScale();
                const offset = getOffset();

                // Clear canvas
                ctx.fillStyle = COLORS.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Save context and apply transformation
                ctx.save();
                ctx.translate(offset.x, offset.y);
                ctx.scale(scale, scale);

                drawScrollingArenaBackground();

                // Draw arena border
                ctx.strokeStyle = COLORS.border;
                ctx.lineWidth = 4;
                ctx.strokeRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);

                // Draw bullets
                ctx.fillStyle = COLORS.bullet;
                for (const bullet of bullets) {
                    if (bullet.type === 'normal') {
                        const angle = Math.atan2(bullet.vy, bullet.vx);
                        const knifeScale = bullet.isCritical ? 1.28 : 1;
                        const projectileSprite = player.relics.includes('Ice Blade') && iceBladeProjectileSprite
                            ? iceBladeProjectileSprite
                            : knifeProjectileSprite;
                        if (projectileSprite &&
                            projectileSprite.complete &&
                            projectileSprite.naturalWidth > 0) {
                            ctx.save();
                            ctx.translate(bullet.x, bullet.y);
                            ctx.rotate(angle);
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(
                                projectileSprite,
                                -18 * knifeScale,
                                -6 * knifeScale,
                                36 * knifeScale,
                                12 * knifeScale
                            );
                            ctx.restore();
                        } else {
                            const radius = bullet.isCritical ? BULLET_RADIUS * 1.5 : BULLET_RADIUS;
                            ctx.beginPath();
                            ctx.arc(bullet.x, bullet.y, radius, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (bullet.type === 'blackRod') {
                        const angle = Math.atan2(bullet.vy, bullet.vx);
                        if (blackRodProjectileSprite &&
                            blackRodProjectileSprite.complete &&
                            blackRodProjectileSprite.naturalWidth > 0) {
                            ctx.save();
                            ctx.translate(bullet.x, bullet.y);
                            ctx.rotate(angle);
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(
                                blackRodProjectileSprite,
                                -26,
                                -7,
                                52,
                                14
                            );
                            ctx.restore();
                        } else {
                            ctx.save();
                            ctx.translate(bullet.x, bullet.y);
                            ctx.rotate(angle);
                            ctx.fillStyle = '#1a1a1a';
                            ctx.fillRect(-16, -3, 28, 6);
                            ctx.beginPath();
                            ctx.moveTo(12, -6);
                            ctx.lineTo(24, 0);
                            ctx.lineTo(12, 6);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                        ctx.fillStyle = COLORS.bullet;
                    } else if (bullet.type === 'fireball') {
                        const angle = Math.atan2(bullet.vy, bullet.vx);
                        const fireballSprite = bullet.big && bigFireballProjectileSprite
                            ? bigFireballProjectileSprite
                            : fireballProjectileSprite;
                        const fireballWidth = bullet.big ? 70 : 36;
                        const fireballHeight = bullet.big ? 24 : 12;
                        if (fireballSprite && fireballSprite.complete && fireballSprite.naturalWidth > 0) {
                            ctx.save();
                            ctx.translate(bullet.x, bullet.y);
                            ctx.rotate(angle);
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(fireballSprite, -fireballWidth / 2, -fireballHeight / 2, fireballWidth, fireballHeight);
                            ctx.restore();
                        } else {
                            ctx.fillStyle = '#ff6a1f';
                            ctx.beginPath();
                            ctx.arc(bullet.x, bullet.y, bullet.big ? 14 : 8, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = COLORS.bullet;
                        }
                    } else if (bullet.type === 'heroSlash') {
                        // Draw a DNF-style outer blade flash: a bright arc sweeps
                        // along a flattened halo with a fading trail.
                        const progress = 1 - (bullet.lifetime / bullet.maxLifetime);
                        const opacity = Math.max(0, 1 - progress * progress);
                        const drawRadius = bullet.radius * (0.72 + progress * 0.18);
                        const squash = 0.28;
                        const sweepStart = -Math.PI * 0.35 + progress * Math.PI * 1.65;
                        const sweepLength = Math.PI * 0.68;
                        const sweepEnd = sweepStart + sweepLength;

                        ctx.save();
                        ctx.globalAlpha = opacity;
                        ctx.translate(bullet.x, bullet.y);
                        ctx.rotate(bullet.swingAngle);
                        ctx.scale(1, squash);

                        for (let i = 0; i < 4; i++) {
                            const trailEnd = sweepEnd - i * Math.PI * 0.16;
                            const trailStart = trailEnd - sweepLength * (0.78 - i * 0.12);
                            const trailOpacity = opacity * (1 - i * 0.22);
                            ctx.strokeStyle = `rgba(255, 170, 42, ${0.18 * trailOpacity})`;
                            ctx.lineWidth = 18 - i * 3;
                            ctx.beginPath();
                            ctx.arc(0, 0, drawRadius - i * 2, trailStart, trailEnd);
                            ctx.stroke();

                            ctx.strokeStyle = `rgba(255, 222, 80, ${0.46 * trailOpacity})`;
                            ctx.lineWidth = 8 - i * 1.4;
                            ctx.beginPath();
                            ctx.arc(0, 0, drawRadius - i * 2, trailStart + 0.03, trailEnd - 0.02);
                            ctx.stroke();
                        }

                        ctx.strokeStyle = `rgba(255, 250, 205, ${opacity})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, drawRadius * 0.99, sweepEnd - sweepLength * 0.42, sweepEnd);
                        ctx.stroke();

                        const tipX = Math.cos(sweepEnd) * drawRadius;
                        const tipY = Math.sin(sweepEnd) * drawRadius;
                        ctx.fillStyle = `rgba(255, 245, 180, ${opacity})`;
                        ctx.beginPath();
                        ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Draw frost relic area effects
                if (player.relics.includes('Ice Shield')) {
                    const shieldRadius = 200;
                    const iceShieldCycle = gameTime % 6;
                    const iceShieldAlpha = iceShieldCycle < 1
                        ? iceShieldCycle * 0.1
                        : iceShieldCycle < 2
                            ? (2 - iceShieldCycle) * 0.1
                            : 0;

                    if (iceShieldAlpha > 0) {
                        ctx.save();
                        ctx.translate(player.x, player.y);
                        ctx.globalAlpha = iceShieldAlpha;
                        ctx.strokeStyle = '#d8fbff';
                        ctx.lineWidth = 4;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI * 2 * i) / 6 - Math.PI / 2;
                            ctx.save();
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(0, -shieldRadius * 0.86);
                            ctx.moveTo(0, -shieldRadius * 0.34);
                            ctx.lineTo(-shieldRadius * 0.1, -shieldRadius * 0.47);
                            ctx.moveTo(0, -shieldRadius * 0.34);
                            ctx.lineTo(shieldRadius * 0.1, -shieldRadius * 0.47);
                            ctx.moveTo(0, -shieldRadius * 0.58);
                            ctx.lineTo(-shieldRadius * 0.14, -shieldRadius * 0.72);
                            ctx.moveTo(0, -shieldRadius * 0.58);
                            ctx.lineTo(shieldRadius * 0.14, -shieldRadius * 0.72);
                            ctx.stroke();
                            ctx.restore();
                        }

                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI * 2 * i) / 6 - Math.PI / 2;
                            const x = Math.cos(angle) * shieldRadius * 0.36;
                            const y = Math.sin(angle) * shieldRadius * 0.36;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                for (const blizzard of blizzards) {
                    const opacity = Math.max(0, blizzard.lifetime / blizzard.maxLifetime);
                    ctx.save();
                    ctx.translate(blizzard.x, blizzard.y);
                    ctx.rotate(blizzard.angle);
                    ctx.fillStyle = `rgba(110, 220, 255, ${0.12 * opacity})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, blizzard.radius, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 5; i++) {
                        ctx.strokeStyle = `rgba(210, 250, 255, ${0.35 * opacity})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        const start = i * Math.PI * 0.4;
                        ctx.arc(0, 0, blizzard.radius * (0.35 + i * 0.11), start, start + Math.PI * 0.75);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                for (const hazard of fireHazards) {
                    const progress = 1 - hazard.delay / hazard.maxDelay;
                    const pulse = 0.35 + Math.sin(gameTime * 18) * 0.15;
                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 92, 24, ${0.55 + pulse})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(hazard.x, hazard.y, hazard.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = `rgba(255, 80, 20, ${0.08 + progress * 0.08})`;
                    ctx.beginPath();
                    ctx.arc(hazard.x, hazard.y, hazard.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = `rgba(255, 220, 100, ${0.45 + progress * 0.3})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(hazard.x, hazard.y, hazard.radius * progress, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                for (const explosion of fireExplosions) {
                    const progress = 1 - explosion.lifetime / explosion.maxLifetime;
                    const opacity = Math.max(0, explosion.lifetime / explosion.maxLifetime);
                    const size = explosion.radius * 2.7 * (0.7 + progress * 0.5);
                    ctx.save();
                    ctx.globalAlpha = opacity;
                    if (fireExplosionSprite && fireExplosionSprite.complete && fireExplosionSprite.naturalWidth > 0) {
                        ctx.imageSmoothingEnabled = false;
                        ctx.drawImage(fireExplosionSprite, explosion.x - size / 2, explosion.y - size / 2, size, size);
                    } else {
                        ctx.fillStyle = `rgba(255, 105, 24, ${0.45 * opacity})`;
                        ctx.beginPath();
                        ctx.arc(explosion.x, explosion.y, explosion.radius * (1 + progress), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Draw pickups
                for (const pickup of pickups) {
                    ctx.save();
                    ctx.globalAlpha = getPickupDrawAlpha(pickup);

                    if (pickup.type === 'health') {
                        const heartSprite = pickupSprites.healthHeart;
                        const heartSize = 28;
                        if (heartSprite && heartSprite.complete && heartSprite.naturalWidth > 0) {
                            ctx.save();
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(
                                heartSprite,
                                pickup.x - heartSize / 2,
                                pickup.y - heartSize / 2,
                                heartSize,
                                heartSize
                            );
                            ctx.restore();
                        } else {
                            ctx.fillStyle = '#e91e63';
                            ctx.beginPath();
                            ctx.arc(pickup.x, pickup.y, 10, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (pickup.type === 'exp') {
                        const expSprite = pickup.crystalSize === 'large' ? pickupSprites.expLarge : pickupSprites.expSmall;
                        const expSize = pickup.crystalSize === 'large' ? 30 : 22;
                        if (expSprite && expSprite.complete && expSprite.naturalWidth > 0) {
                            ctx.save();
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(
                                expSprite,
                                pickup.x - expSize / 2,
                                pickup.y - expSize / 2,
                                expSize,
                                expSize
                            );
                            ctx.restore();
                        } else {
                            ctx.fillStyle = pickup.crystalSize === 'large' ? '#7ff7ff' : '#3fa7ff';
                            ctx.beginPath();
                            ctx.arc(pickup.x, pickup.y, pickup.crystalSize === 'large' ? 10 : 7, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (pickup.type === 'relic') {
                        const iconSize = 64;
                        const relicIcon = relicIconCache[pickup.relicName];
                        
                        if (relicIcon && relicIcon.complete && relicIcon.naturalWidth > 0) {
                            ctx.save();
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(
                                relicIcon,
                                pickup.x - iconSize / 2,
                                pickup.y - iconSize / 2,
                                iconSize,
                                iconSize
                            );
                            ctx.restore();
                            
                            // Draw glow effect around icon
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.arc(pickup.x, pickup.y, iconSize / 2 + 2, 0, Math.PI * 2);
                            ctx.stroke();
                        } else {
                            // Fallback: colored circle if icon not loaded
                            const relicColors = {
                                'Vampire Mask': '#e74c3c',
                                'Hero Sword': '#f39c12',
                                'Red Mushroom': '#e91e63',
                                'Gravity Glove': '#9c27b0',
                                'Magic Shield': '#2196f3',
                                'Black Rod': '#1a1a1a',
                                'Ice Blade': '#7ce8ff',
                                'Ice Staff': '#54c8ff',
                                'Ice Shield': '#8df4ff',
                                'Fire Armor': '#ff6a1f',
                                'Fire Staff': '#ff9f2a',
                                'Fire Heart': '#ff3d4f'
                            };
                            ctx.fillStyle = relicColors[pickup.relicName] || '#666666';
                            ctx.beginPath();
                            ctx.arc(pickup.x, pickup.y, 20, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                        }
                    }

                    ctx.restore();
                }

                // Draw magic shield break effects
                for (const effect of shieldBreakEffects) {
                    const progress = 1 - effect.lifetime / effect.maxLifetime;
                    const opacity = Math.max(0, effect.lifetime / effect.maxLifetime);
                    const shockRadius = 36 + effect.radius * progress;

                    ctx.save();
                    ctx.globalAlpha = opacity;
                    ctx.strokeStyle = `rgba(100, 205, 255, ${0.85 * opacity})`;
                    ctx.lineWidth = 8 * (1 - progress) + 2;
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, shockRadius, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.strokeStyle = `rgba(210, 245, 255, ${0.55 * opacity})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, shockRadius * 0.78, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.fillStyle = `rgba(120, 220, 255, ${0.28 * opacity})`;
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, 34 + 28 * progress, 0, Math.PI * 2);
                    ctx.fill();

                    for (const shard of effect.shards) {
                        const distance = shard.speed * progress * effect.maxLifetime;
                        const x = effect.x + Math.cos(shard.angle) * distance;
                        const y = effect.y + Math.sin(shard.angle) * distance;
                        ctx.save();
                        ctx.translate(x, y);
                        ctx.rotate(shard.angle + progress * shard.spin);
                        ctx.fillStyle = `rgba(180, 240, 255, ${opacity})`;
                        ctx.beginPath();
                        ctx.moveTo(shard.size, 0);
                        ctx.lineTo(-shard.size * 0.6, -shard.size * 0.45);
                        ctx.lineTo(-shard.size * 0.25, shard.size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.restore();
                }

                // Draw enemy death sprites
                for (const deathEffect of enemyDeathEffects) {
                    const progress = 1 - deathEffect.lifetime / deathEffect.maxLifetime;
                    const opacity = Math.max(0, deathEffect.lifetime / deathEffect.maxLifetime);
                    const deathSprite = deathEffect.spriteSet === 'goblinKing'
                        ? goblinKingSprites.death
                        : deathEffect.spriteSet === 'zombieKing'
                        ? zombieKingSprites.death
                        : deathEffect.spriteSet === 'levelThree'
                        ? levelThreeSprites.death
                        : deathEffect.spriteSet === 'zombie'
                        ? zombieSprites.death
                        : goblinSprites.death;
                    drawSpriteImage(
                        deathSprite,
                        deathEffect.x,
                        deathEffect.y,
                        deathEffect.size || 54,
                        deathEffect.facing,
                        opacity,
                        progress * 8
                    );
                }

                // Draw enemies
                for (const enemy of enemies) {
                    // Scale enemy size based on wave
                    const waveScale = (1 + (enemy.wave - 1) * 0.15) * (enemy.sizeScale || 1);
                    const enemyRadius = ENEMY_RADIUS * waveScale;

                    if (isLevelOneGoblin(enemy) && drawGoblinEnemy(enemy, enemyRadius)) {
                        if (enemy.hp < enemy.maxHp) {
                            const barWidth = enemyRadius * 2.2;
                            const barHeight = 4;
                            const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);

                            ctx.fillStyle = 'rgba(255, 71, 87, 0.5)';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 16, barWidth, barHeight);

                            ctx.fillStyle = '#2ecc71';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 16, barWidth * hpPercent, barHeight);
                        }
                        continue;
                    }

                    if (isLevelTwoZombie(enemy) && drawZombieEnemy(enemy, enemyRadius)) {
                        if (enemy.hp < enemy.maxHp) {
                            const barWidth = enemyRadius * 2.2;
                            const barHeight = 4;
                            const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);

                            ctx.fillStyle = 'rgba(255, 71, 87, 0.5)';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 16, barWidth, barHeight);

                            ctx.fillStyle = '#2ecc71';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 16, barWidth * hpPercent, barHeight);
                        }
                        continue;
                    }

                    if (isLevelThreeSkeleton(enemy) && drawLevelThreeEnemy(enemy, enemyRadius)) {
                        if (enemy.hp < enemy.maxHp) {
                            const barWidth = enemyRadius * 2.2;
                            const barHeight = 4;
                            const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);

                            ctx.fillStyle = 'rgba(255, 71, 87, 0.5)';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 16, barWidth, barHeight);

                            ctx.fillStyle = '#2ecc71';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 16, barWidth * hpPercent, barHeight);
                        }
                        continue;
                    }

                    if (isZombieKingElite(enemy) && drawZombieKingEnemy(enemy, enemyRadius)) {
                        if (enemy.hp < enemy.maxHp) {
                            const barWidth = enemyRadius * 2.4;
                            const barHeight = 5;
                            const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);

                            ctx.fillStyle = 'rgba(80, 10, 18, 0.75)';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 20, barWidth, barHeight);

                            ctx.fillStyle = '#ff7a2a';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 20, barWidth * hpPercent, barHeight);
                        }
                        continue;
                    }

                    if (isGoblinKingElite(enemy) && drawGoblinKingEnemy(enemy, enemyRadius)) {
                        if (enemy.hp < enemy.maxHp) {
                            const barWidth = enemyRadius * 2.4;
                            const barHeight = 5;
                            const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);

                            ctx.fillStyle = 'rgba(80, 10, 18, 0.75)';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 20, barWidth, barHeight);

                            ctx.fillStyle = '#ffcc33';
                            ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 20, barWidth * hpPercent, barHeight);
                        }
                        continue;
                    }
                    
                    // Color intensity increases with wave
                    let colorIntensity = Math.min(1, 0.6 + enemy.wave * 0.04);
                    
                    // Bleeding effect - turn red
                    if (enemy.bleedingTimer > 0) {
                        ctx.fillStyle = `rgba(255, 71, 87, 1)`;
                        ctx.strokeStyle = `rgba(255, 100, 100, 1)`;
                    } else if (enemy.eliteId === 'S1') {
                        ctx.fillStyle = `rgba(95, 220, 255, 0.92)`;
                        ctx.strokeStyle = `rgba(225, 250, 255, 0.95)`;
                    } else if (enemy.eliteId === 'S2') {
                        ctx.fillStyle = `rgba(255, 106, 31, 0.94)`;
                        ctx.strokeStyle = `rgba(255, 226, 120, 0.95)`;
                    } else if (enemy.fireBurnTimer > 0) {
                        ctx.fillStyle = `rgba(255, 88, 20, ${colorIntensity})`;
                        ctx.strokeStyle = `rgba(255, 190, 80, ${colorIntensity})`;
                    } else if ((enemy.iceSlow || 0) > 0 || enemy.blizzardSlowTimer > 0) {
                        ctx.fillStyle = `rgba(95, 190, 255, ${colorIntensity})`;
                        ctx.strokeStyle = `rgba(180, 240, 255, ${colorIntensity})`;
                    } else {
                        ctx.fillStyle = `rgba(255, 71, 87, ${colorIntensity})`;
                        ctx.strokeStyle = `rgba(204, 58, 71, ${colorIntensity})`;
                    }
                    
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemyRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    drawEnemyStatusParticles(enemy, enemyRadius);

                    if (enemy.eliteId === 'S1') {
                        ctx.strokeStyle = 'rgba(230, 255, 255, 0.85)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x - enemyRadius * 1.35, enemy.y - enemyRadius * 0.1);
                        ctx.quadraticCurveTo(enemy.x - enemyRadius * 0.45, enemy.y - enemyRadius * 1.0, enemy.x, enemy.y - enemyRadius * 0.15);
                        ctx.quadraticCurveTo(enemy.x + enemyRadius * 0.45, enemy.y - enemyRadius * 1.0, enemy.x + enemyRadius * 1.35, enemy.y - enemyRadius * 0.1);
                        ctx.stroke();
                    } else if (enemy.eliteId === 'S2') {
                        ctx.strokeStyle = 'rgba(255, 225, 120, 0.88)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x - enemyRadius * 1.35, enemy.y - enemyRadius * 0.1);
                        ctx.quadraticCurveTo(enemy.x - enemyRadius * 0.45, enemy.y - enemyRadius * 1.0, enemy.x, enemy.y - enemyRadius * 0.15);
                        ctx.quadraticCurveTo(enemy.x + enemyRadius * 0.45, enemy.y - enemyRadius * 1.0, enemy.x + enemyRadius * 1.35, enemy.y - enemyRadius * 0.1);
                        ctx.stroke();
                    }
                    
                    // Draw wave number on enemy
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(12, enemyRadius * 1.2)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(enemy.eliteId || enemy.wave, enemy.x, enemy.y);
                    
                    // Draw HP bar above enemy if damaged
                    if (enemy.hp < enemy.maxHp) {
                        const barWidth = enemyRadius * 2;
                        const barHeight = 4;
                        const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);
                        
                        ctx.fillStyle = 'rgba(255, 71, 87, 0.5)';
                        ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 12, barWidth, barHeight);
                        
                        ctx.fillStyle = '#2ecc71';
                        ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemyRadius - 12, barWidth * hpPercent, barHeight);
                    }
                }

                // Draw floating heal text
                for (const floatingText of floatingTexts) {
                    const progress = 1 - floatingText.lifetime / floatingText.maxLifetime;
                    const opacity = Math.max(0, floatingText.lifetime / floatingText.maxLifetime);
                    ctx.save();
                    ctx.globalAlpha = opacity;
                    ctx.fillStyle = floatingText.color;
                    ctx.font = 'bold 22px Inter, Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(floatingText.text, floatingText.x, floatingText.y - progress * 8);
                    ctx.restore();
                }

                // Draw player. Keep the high-resolution single sprite as the stable
                // source of truth; movement uses a small bob instead of swapping
                // sprite sheets, which prevents disappearing/flickering players.
                const isMoving = Math.sqrt(player.vx * player.vx + player.vy * player.vy) > 0.1;
                const displaySize = SPRITE_DISPLAY_SIZE;
                const bobOffset = isMoving ? Math.sin(gameTime * 14) * 2 : Math.sin(gameTime * 3) * 0.8;
                const leanAngle = isMoving ? player.vx * 0.08 : 0;
                const facing = player.vx < -0.1 ? -1 : 1;

                const actionFrame = playerVisualAction ? getPlayerActionFrame(playerVisualAction) : null;
                if ((actionFrame && actionFrame.image.complete) ||
                    (playerBaseSprite && playerBaseSprite.complete && playerBaseSprite.naturalWidth > 0)) {
                    ctx.save();
                    ctx.translate(player.x, player.y + bobOffset);
                    ctx.rotate(leanAngle);
                    ctx.scale(facing, 1);
                    if (actionFrame) {
                        ctx.drawImage(
                            actionFrame.image,
                            actionFrame.sx,
                            actionFrame.sy,
                            actionFrame.sw,
                            actionFrame.sh,
                            -displaySize / 2,
                            -displaySize / 2,
                            displaySize,
                            displaySize
                        );
                    } else {
                        ctx.drawImage(
                            playerBaseSprite,
                            -displaySize / 2,
                            -displaySize / 2,
                            displaySize,
                            displaySize
                        );
                    }
                    ctx.restore();

                } else {
                    // Fallback: draw a simple circle if sprites are not loaded.
                    ctx.fillStyle = COLORS.player;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw magic shield bar
                if (player.relics.includes('Magic Shield') && player.magicShieldMaxValue > 0) {
                    const shieldPercent = player.magicShield / player.magicShieldMaxValue;
                    const barWidth = 60;
                    const barHeight = 4;
                    const barX = player.x - barWidth / 2;
                    const barY = player.y - PLAYER_RADIUS - 20;
                    
                    ctx.fillStyle = 'rgba(33, 150, 243, 0.3)';
                    ctx.fillRect(barX, barY, barWidth, barHeight);
                    
                    ctx.fillStyle = '#2196f3';
                    ctx.fillRect(barX, barY, barWidth * shieldPercent, barHeight);
                }

                // Draw joystick (mobile)
                if (joystick.active && mode === 'play') {
                    // Base
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.beginPath();
                    ctx.arc(joystick.baseX, joystick.baseY, JOYSTICK_MAX_RADIUS, 0, Math.PI * 2);
                    ctx.fill();

                    // Stick
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(joystick.stickX, joystick.stickY, 30, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();

                // Edit mode indicator
                if (mode === 'edit') {
                    editInfoEl.style.display = 'block';
                } else {
                    editInfoEl.style.display = 'none';
                }
            }

            // Initialize
            initGame();

            // If edit mode, show static preview
            if (mode === 'edit') {
                // Spawn some enemies for preview with wave stats
                const previewWave = 3;
                const previewStats = getEnemyStats(previewWave);
                for (let i = 0; i < 5; i++) {
                    enemies.push({
                        x: 100 + Math.random() * (ARENA_WIDTH - 200),
                        y: 100 + Math.random() * (ARENA_HEIGHT - 200),
                        hp: previewStats.hp,
                        maxHp: previewStats.hp,
                        speed: previewStats.speed,
                        expReward: previewStats.expReward,
                        wave: previewWave,
                        attackRange: NORMAL_ENEMY_ATTACK_RANGE,
                        attackCooldown: 0,
                        bleedingTimer: 0,
                        fireBurnTimer: 0,
                        iceSlow: 0,
                        iceSlowTimer: 0,
                        blizzardSlowTimer: 0,
                        slowTimer: 0,
                        slowAmount: 0.5,
                        hurtTimer: 0,
                        attackAnimTimer: 0,
                        facing: 1
                    });
                }
                spawnS1Elite();
                spawnS2Elite();
                
                // Add some pickups for preview
                pickups.push(createPickup({
                    x: 200,
                    y: 400,
                    type: 'health',
                }));
                pickups.push(createPickup({
                    x: 300,
                    y: 500,
                    type: 'exp',
                    value: 1,
                    crystalSize: 'small'
                }));
                pickups.push(createPickup({
                    x: 380,
                    y: 520,
                    type: 'exp',
                    value: 5,
                    crystalSize: 'large'
                }));
                pickups.push(createPickup({
                    x: 500,
                    y: 600,
                    type: 'relic',
                    relicName: 'Vampire Mask'
                }));
            }

            // Game loop
            let lastTime = 0;
            function gameLoop(timestamp) {
                const dt = lastTime ? (timestamp - lastTime) / 1000 : 0;
                lastTime = timestamp;

                update(dt);
                render();

                requestAnimationFrame(gameLoop);
            }
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
