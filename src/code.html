<!DOCTYPE html>
<html>
<head>
    <title>Vortex Survivor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --player-color: #00d9ff;
            --enemy-color: #ff4757;
            --bullet-color: #ffd700;
            --ui-text: #ffffff;
            --hp-green: #2ecc71;
            --hp-red: #e74c3c;
            --transition-fast: 150ms;
            --transition-normal: 300ms;
            --space-sm: 16px;
            --space-md: 24px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
        }

        #game-world {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: var(--space-sm);
            left: var(--space-sm);
            right: var(--space-sm);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .hp-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hp-label {
            color: var(--ui-text);
            font-size: 28px;
            font-weight: 700;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            letter-spacing: 0.5px;
        }

        .hp-bar-bg {
            width: 260px;
            height: 28px;
            background-color: var(--hp-red);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.15);
        }

        .hp-bar-fill {
            height: 100%;
            background-color: var(--hp-green);
            transition: width var(--transition-fast) ease-out;
        }

        .kill-count {
            color: var(--ui-text);
            font-size: 40px;
            font-weight: 700;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: right;
            font-family: 'Orbitron', sans-serif;
        }

        .kill-label {
            font-size: 20px;
            font-weight: 600;
            opacity: 0.85;
            letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
        }

        /* Game Over Screen */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--space-md);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-normal) ease-out;
        }

        .game-over-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .game-over-title {
            color: var(--enemy-color);
            font-size: 56px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 30px var(--enemy-color), 0 4px 12px rgba(0,0,0,0.5);
            letter-spacing: 3px;
        }

        .final-score {
            color: var(--ui-text);
            font-size: 28px;
            text-align: center;
            font-weight: 600;
            opacity: 0.9;
        }

        .final-score span {
            color: var(--bullet-color);
            font-size: 72px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            display: block;
            margin-top: 12px;
            text-shadow: 0 0 20px var(--bullet-color);
        }

        .restart-btn {
            margin-top: var(--space-lg);
            padding: 20px 64px;
            min-height: 96px;
            font-size: 26px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            color: var(--bg-color);
            background: linear-gradient(135deg, var(--player-color) 0%, #00a8cc 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform var(--transition-fast) ease-out, 
                        box-shadow var(--transition-fast) ease-out;
            box-shadow: 0 6px 24px rgba(0, 217, 255, 0.5);
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.7);
        }

        .restart-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(0, 217, 255, 0.5);
        }

        .restart-btn:focus-visible {
            outline: 3px solid var(--bullet-color);
            outline-offset: 3px;
        }

        /* Level-up Panel */
        .levelup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--space-md);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-normal) ease-out;
            z-index: 100;
        }

        .levelup-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .levelup-title {
            color: var(--bullet-color);
            font-size: 48px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 30px var(--bullet-color), 0 4px 12px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .levelup-choices {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 90%;
            max-width: 600px;
        }

        .upgrade-btn {
            padding: 24px 32px;
            min-height: 96px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
            color: var(--bg-color);
            background: linear-gradient(135deg, #00d9ff 0%, #00a8cc 100%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: transform var(--transition-fast) ease-out, 
                        box-shadow var(--transition-fast) ease-out,
                        background var(--transition-fast) ease-out;
            box-shadow: 0 4px 16px rgba(0, 217, 255, 0.3);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .upgrade-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 24px rgba(0, 217, 255, 0.6);
            background: linear-gradient(135deg, #00e6ff 0%, #00b8d4 100%);
        }

        .upgrade-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 217, 255, 0.4);
        }

        .upgrade-btn:focus-visible {
            outline: 3px solid var(--bullet-color);
            outline-offset: 3px;
        }

        .upgrade-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .upgrade-desc {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Edit Mode Info */
        .edit-info {
            position: absolute;
            bottom: var(--space-md);
            left: 50%;
            transform: translateX(-50%);
            color: var(--ui-text);
            font-size: 20px;
            font-weight: 600;
            opacity: 0.8;
            text-align: center;
            pointer-events: none;
            background: rgba(0,0,0,0.4);
            padding: 12px 24px;
            border-radius: 8px;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            .hp-bar-fill,
            .game-over-overlay,
            .restart-btn {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-world">
        <canvas id="game-canvas"></canvas>
        <div class="ui-overlay">
            <div class="hud">
                <div class="hp-container">
                    <div class="hp-label">HP: <span id="hp-value">100</span></div>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="hp-bar"></div>
                    </div>
                    <div class="hp-label" style="font-size: 20px; margin-top: 8px;">
                        Level <span id="level-value">1</span> - EXP <span id="exp-value">0</span>/<span id="exp-required">10</span>
                    </div>
                </div>
                <div class="kill-count">
                    <div class="kill-label">KILLS</div>
                    <div id="kill-value">0</div>
                </div>
            </div>
            <div class="game-over-overlay" id="game-over">
                <div class="game-over-title">GAME OVER</div>
                <div class="final-score">
                    Final Score
                    <span id="final-kills">0</span>
                </div>
                <button class="restart-btn" id="restart-btn">PLAY AGAIN</button>
            </div>
            <div class="levelup-overlay" id="levelup-panel">
                <div class="levelup-title">LEVEL UP!</div>
                <div class="levelup-choices" id="levelup-choices"></div>
            </div>
            <div class="edit-info" id="edit-info" style="display: none;">
                Edit Mode - Adjust parameters in the panel
            </div>
            <div id="relic-bar" style="
                position: absolute;
                top: 50%;
                left: 12px;
                transform: translateY(-50%);
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                max-height: 70%;
                overflow: hidden;
                pointer-events: none;
            "></div>
            <div id="run-progress" style="
                position: absolute;
                top: 50%;
                right: 12px;
                transform: translateY(-50%);
                width: 34px;
                height: 70%;
                min-height: 420px;
                max-height: 760px;
                border: 2px solid rgba(255,255,255,0.28);
                border-radius: 6px;
                background: rgba(8, 7, 14, 0.62);
                box-shadow: 0 0 14px rgba(0,0,0,0.45), inset 0 0 10px rgba(255,255,255,0.08);
                overflow: hidden;
                pointer-events: none;
            ">
                <div id="run-progress-fill" style="
                    position: absolute;
                    left: 0;
                    bottom: 0;
                    width: 100%;
                    height: 0%;
                    background: linear-gradient(180deg, #ffd700 0%, #00d9ff 55%, #2ecc71 100%);
                    box-shadow: 0 0 14px rgba(0,217,255,0.65);
                "></div>
                <div id="run-progress-segments" style="
                    position: absolute;
                    inset: 0;
                    display: flex;
                    flex-direction: column-reverse;
                "></div>
            </div>
        </div>
    </div>

    <script>
        /*
         * VORTEX SURVIVOR
         * A minimalist survival game where you control a circle, 
         * dodging enemies while auto-firing at the nearest threat.
         * Survive as long as possible and rack up kills!
         */

        async function run(mode) {
            const gameWorld = document.getElementById('game-world');
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');

            // UI Elements
            const hpValueEl = document.getElementById('hp-value');
            const hpBarEl = document.getElementById('hp-bar');
            const killValueEl = document.getElementById('kill-value');
            const gameOverEl = document.getElementById('game-over');
            const finalKillsEl = document.getElementById('final-kills');
            const restartBtn = document.getElementById('restart-btn');
            const editInfoEl = document.getElementById('edit-info');
            const levelValueEl = document.getElementById('level-value');
            const expValueEl = document.getElementById('exp-value');
            const expRequiredEl = document.getElementById('exp-required');
            const levelupPanelEl = document.getElementById('levelup-panel');
            const levelupChoicesEl = document.getElementById('levelup-choices');

            // Player sprite cache
            let playerBaseSprite = null;
            const playerActionSprites = {
                attack: null,
                hurt: null,
                death: null
            };
            const PLAYER_ACTIONS = {
                attack: { duration: 0.35, fps: 18, loop: false },
                hurt: { duration: 0.35, fps: 14, loop: false },
                death: { duration: 0.65, fps: 10, loop: false }
            };
            let playerVisualAction = null;
            let playerVisualActionElapsed = 0;
            let playerVisualActionDuration = 0;
            const SPRITE_DISPLAY_SIZE = 60; // Display size in game units
            
            // Relic icon cache
            const relicIconCache = {
                'Vampire Mask': null,
                'Magic Shield': null,
                'Black Rod': null,
                'Red Mushroom': null,
                'Gravity Glove': null,
                'Hero Sword': null,
                'Ice Blade': null,
                'Ice Staff': null,
                'Ice Shield': null,
                'Fire Armor': null,
                'Fire Staff': null,
                'Fire Heart': null
            };
            const relicIconAssets = {
                'Vampire Mask': ['relic-vampire-mask', 'relic-vampire-mask-icon'],
                'Magic Shield': ['relic-magic-shield', 'relic-magic-shield-icon'],
                'Black Rod': ['relic-black-rod', 'relic-black-rod-icon'],
                'Red Mushroom': ['relic-red-mushroom', 'relic-red-mushroom-icon'],
                'Gravity Glove': ['relic-gravity-glove', 'relic-gravity-glove-icon'],
                'Hero Sword': ['relic-hero-sword', 'relic-hero-sword-icon'],
                'Ice Blade': ['relic-ice-blade', 'relic-ice-blade-icon'],
                'Ice Staff': ['relic-ice-staff', 'relic-ice-staff-icon'],
                'Ice Shield': ['relic-ice-shield', 'relic-ice-shield-icon'],
                'Fire Armor': ['relic-fire-armor', 'relic-fire-armor-icon'],
                'Fire Staff': ['relic-fire-staff', 'relic-fire-staff-icon'],
                'Fire Heart': ['relic-fire-heart', 'relic-fire-heart-icon']
            };
            const heroSwordSlashSprites = {
                small: null,
                medium: null,
                large: null
            };
            const heroSwordSlashAssets = {
                small: ['hero-sword-slash-small'],
                medium: ['hero-sword-slash-medium'],
                large: ['hero-sword-slash-large']
            };
            let blackRodProjectileSprite = null;
            const blackRodProjectileAssets = ['black-rod-projectile'];
            let knifeProjectileSprite = null;
            const knifeProjectileAssets = ['knife-projectile'];
            let iceBladeProjectileSprite = null;
            const iceBladeProjectileAssets = ['ice-blade-projectile'];
            let fireballProjectileSprite = null;
            let bigFireballProjectileSprite = null;
            let fireExplosionSprite = null;
            const fireballProjectileAssets = ['fireball-projectile'];
            const bigFireballProjectileAssets = ['big-fireball-projectile', 'fireball-projectile-large'];
            const fireExplosionAssets = ['fire-explosion-effect'];
            const terrainSprites = {
                center: null,
                border: null,
                detail: null
            };
            const terrainSpriteAssets = {
                center: ['terrain-center-tile', 'terrain-center-tile.png'],
                border: ['terrain-side-border', 'terrain-side-border.png'],
                detail: ['terrain-side-detail', 'terrain-side-detail.png']
            };
            const goblinSprites = {
                idle: null,
                walk: null,
                run: null,
                attack: null,
                hurt: null,
                death: null
            };
            const goblinSpriteAssets = {
                idle: ['goblin-idle'],
                walk: ['goblin-walk', 'goblin-run'],
                run: ['goblin-run'],
                attack: ['goblin-attack'],
                hurt: ['goblin-hurt'],
                death: ['goblin-death']
            };
            const zombieSprites = {
                idle: null,
                walk: null,
                attack: null,
                hurt: null,
                death: null
            };
            const zombieSpriteAssets = {
                idle: ['zombie-idle', 'zombie-idle.png'],
                walk: ['zombie-walk', 'zombie-walk.png'],
                attack: ['zombie-attack', 'zombie-attack.png'],
                hurt: ['zombie-hurt', 'zombie-hurt.png'],
                death: ['zombie-death', 'zombie-death.png']
            };
            const levelThreeSprites = {
                idle: null,
                walk: [],
                attack: [],
                hurt: [],
                death: null
            };
            const levelThreeSpriteAssets = {
                idle: ['level-3-idle', 'level-3-idle.png'],
                walk: ['level-3-walk', 'level-3-walk.png', 'level-3-walk-2', 'level-3-walk-2.png'],
                attack: ['level-3-attack-1', 'level-3-attack-1.png', 'level-3-attack', 'level-3-attack.png', 'level-3-attack-2', 'level-3-attack-2.png'],
                hurt: ['level-3-hurt-2', 'level-3-hurt-2.png'],
                death: ['level-3-death', 'level-3-death.png']
            };
            const zombieKingSprites = {
                idle: null,
                walk: [],
                attack: [],
                hurt: [],
                death: null
            };
            const zombieKingSpriteAssets = {
                idle: ['zombie-king-idle', 'zombie-king-idle.png'],
                walk: ['zombie-king-walk', 'zombie-king-walk.png', 'zombie-king-walk-2', 'zombie-king-walk-2.png'],
                attack: ['zombie-king-attack-1', 'zombie-king-attack-1.png', 'zombie-king-attack', 'zombie-king-attack.png', 'zombie-king-attack-2', 'zombie-king-attack-2.png'],
                hurt: ['zombie-king-hurt-2', 'zombie-king-hurt-2.png'],
                death: ['zombie-king-death', 'zombie-king-death.png']
            };
            const goblinKingSprites = {
                idle: null,
                walk: [],
                attack: [],
                hurt: [],
                death: null
            };
            const goblinKingSpriteAssets = {
                idle: ['goblin-king-idle'],
                walk: ['goblin-king-walk', 'goblin-king-walk-2'],
                attack: ['goblin-king-attack-1', 'goblin-king-attack', 'goblin-king-attack-2'],
                hurt: ['goblin-king-hurt-2'],
                death: ['goblin-king-death']
            };
            const pickupSprites = {
                expSmall: null,
                expLarge: null,
                healthHeart: null
            };
            const pickupSpriteAssets = {
                expSmall: ['exp-crystal-small'],
                expLarge: ['exp-crystal-large'],
                healthHeart: ['health-heart']
            };
            
            // Preload player sprite and relic icons
            async function preloadPlayerSprites() {
                try {
                    // Load stable high-resolution player sprite first. This is the main
                    // player visual; movement feedback is applied in code.
                    const baseAsset = lib.getAsset('hero-128') || lib.getAsset('hero-single-32');
                    if (baseAsset && baseAsset.url) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        await new Promise((resolve, reject) => {
                            img.onload = () => {
                                playerBaseSprite = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log('Failed to load base player sprite');
                                reject();
                            };
                            img.src = baseAsset.url;
                        }).catch(() => {});
                    }

                    const actionAssets = {
                        attack: lib.getAsset('hero-attack'),
                        hurt: lib.getAsset('hero-hurt'),
                        death: lib.getAsset('hero-death')
                    };

                    await Promise.all(Object.entries(actionAssets).map(([action, asset]) => {
                        if (!asset || !asset.url) return Promise.resolve();

                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        return new Promise((resolve) => {
                            img.onload = () => {
                                playerActionSprites[action] = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log(`Failed to load player ${action} sprite`);
                                resolve();
                            };
                            img.src = asset.url;
                        });
                    }));

                    // Load relic icons
                    await Promise.all(Object.entries(relicIconAssets).map(([relicName, assetIds]) => {
                        const asset = assetIds.map(id => lib.getAsset(id)).find(candidate => candidate && candidate.url);
                        if (!asset || !asset.url) return Promise.resolve();

                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        return new Promise((resolve) => {
                            img.onload = () => {
                                relicIconCache[relicName] = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log(`Failed to load relic icon for ${relicName}`);
                                resolve();
                            };
                            img.src = asset.url;
                        });
                    }));

                    // Load Hero Sword rotating slash effects. These are optional; if
                    // they are not uploaded yet, the canvas fallback still renders.
                    await Promise.all(Object.entries(heroSwordSlashAssets).map(([tier, assetIds]) => {
                        const asset = assetIds.map(id => lib.getAsset(id)).find(candidate => candidate && candidate.url);
                        if (!asset || !asset.url) return Promise.resolve();

                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        return new Promise((resolve) => {
                            img.onload = () => {
                                heroSwordSlashSprites[tier] = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log(`Failed to load Hero Sword slash effect ${tier}`);
                                resolve();
                            };
                            img.src = asset.url;
                        });
                    }));

                    const blackRodAsset = blackRodProjectileAssets
                        .map(id => lib.getAsset(id))
                        .find(candidate => candidate && candidate.url);
                    if (blackRodAsset && blackRodAsset.url) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        await new Promise((resolve) => {
                            img.onload = () => {
                                blackRodProjectileSprite = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log('Failed to load Black Rod projectile sprite');
                                resolve();
                            };
                            img.src = blackRodAsset.url;
                        });
                    }

                    const knifeAsset = knifeProjectileAssets
                        .map(id => lib.getAsset(id))
                        .find(candidate => candidate && candidate.url);
                    if (knifeAsset && knifeAsset.url) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        await new Promise((resolve) => {
                            img.onload = () => {
                                knifeProjectileSprite = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log('Failed to load knife projectile sprite');
                                resolve();
                            };
                            img.src = knifeAsset.url;
                        });
                    }

                    const iceBladeAsset = iceBladeProjectileAssets
                        .map(id => lib.getAsset(id))
                        .find(candidate => candidate && candidate.url);
                    if (iceBladeAsset && iceBladeAsset.url) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        await new Promise((resolve) => {
                            img.onload = () => {
                                iceBladeProjectileSprite = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log('Failed to load ice blade projectile sprite');
                                resolve();
                            };
                            img.src = iceBladeAsset.url;
                        });
                    }

                    const fireballAsset = fireballProjectileAssets
                        .map(id => lib.getAsset(id))
                        .find(candidate => candidate && candidate.url);
                    if (fireballAsset && fireballAsset.url) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        await new Promise((resolve) => {
                            img.onload = () => {
                                fireballProjectileSprite = img;
                                resolve();
                            };
                            img.onerror = () => {
                                lib.log('Failed to load fireball projectile sprite');
                                resolve();
                            };
                            img.src = fireballAsset.url;
                        });
                    }

                    const bigFireballAsset = bigFireballProjectileAssets
                        .map(id => lib.getAsset(id))
                        .find(candidate => candidate && candidate.url);
                    if (bigFireballAsset && bigFireballAsset.url) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';

                const scale = getScale();

                        expReward: 1 + wave,
                        spawnInterval: Math.max(0.3, 1.0 - wave * 0.06)

                return {
                    hp: 2 + wave * 1,
                    speed: config.enemySpeed * (1 + wave * 0.08),

                        x,
                        y,
                        type: 'health'
                    }));
                }
                
                // 50% chance for relic (only if not already dropped)
                if (Math.random() < 0.5) {
                    const availableRelics = RELIC_NAMES.filter(r => !droppedRelics.has(r));
                    if (availableRelics.length > 0) {
                        const relic = availableRelics[Math.floor(Math.random() * availableRelics.length)];
                        droppedRelics.add(relic);
                        pickups.push(createPickup({
                            x,
                            y,
                            type: 'relic',
                            relicName: relic
                        }));
                    }
                }
            }

            // Calculate required EXP for next level
            function getRequiredExp(level) {
                return 10 + level * 5;
            }

            function randomPercent(min = 5, max = 20) {
                return min + Math.floor(Math.random() * (max - min + 1));
            }

            function sampleOptions(options, count) {
                const pool = [...options];
                const result = [];
                while (pool.length > 0 && result.length < count) {
                    const index = Math.floor(Math.random() * pool.length);
                    result.push(pool.splice(index, 1)[0]);
                }
                return result;
            }

            function createPickup(data) {
                return {
                    ...data,
                    lifetime: PICKUP_LIFETIME,
                    maxLifetime: PICKUP_LIFETIME
                };
            }

            function getPickupDrawAlpha(pickup) {
                if (pickup.type === 'relic' || pickup.lifetime == null || pickup.maxLifetime == null) {
                    return 1;
                }

                const age = pickup.maxLifetime - pickup.lifetime;
                if (age < PICKUP_BLINK_START) {
                    return 1;
                }

                return Math.sin(gameTime * 24) > 0 ? 1 : 0.28;
            }

            function getPickupAttractionRadius() {
                return player.relicUpgrades.gravityGlove ? ENHANCED_PICKUP_ATTRACTION_RADIUS : PICKUP_ATTRACTION_RADIUS;
            }

            function getHeroSwordChargeConfig() {
                return player.relicUpgrades.heroSword
                    ? { min: 0.5, mid: 1.0, max: 1.5 }
                    : { min: 1.0, mid: 2.0, max: 3.0 };
            }

            function getIceBladeMaxSlow() {
                return player.relicUpgrades.iceBlade ? 1.0 : 0.6;
            }

            function getIceShieldSlowMultiplier() {
                return player.relicUpgrades.iceShield ? 0.6 : 0.8;
            }

            function getFireRateInterval() {
                return player.fireArmorHasteTimer > 0 ? config.fireRate * 0.5 : config.fireRate;
            }

            function isLevelOneGoblin(enemy) {
                return enemy && enemy.wave === 1 && !enemy.eliteId;
            }

            function isLevelTwoZombie(enemy) {
                return enemy && enemy.wave === 2 && !enemy.eliteId;
            }

            function isLevelThreeSkeleton(enemy) {
                return enemy && enemy.wave === 3 && !enemy.eliteId;
            }

            function isGoblinKingElite(enemy) {
                return enemy && enemy.eliteId === 'S1';
            }

            function isZombieKingElite(enemy) {
                return enemy && enemy.eliteId === 'S2';
            }

            function getEnemyFacingTowardPlayer(enemy, dxToPlayer) {
                if (isGoblinKingElite(enemy)) {
                    return dxToPlayer < 0 ? 1 : -1;
                }
                return dxToPlayer < 0 ? -1 : 1;
            }

            function markEnemyHit(enemy) {
                if (isLevelOneGoblin(enemy) || isLevelTwoZombie(enemy) || isLevelThreeSkeleton(enemy) || isGoblinKingElite(enemy) || isZombieKingElite(enemy)) {
                    enemy.hurtTimer = 0.18;
                }
            }

            function addEnemyDeathEffect(enemy) {
                if (!isLevelOneGoblin(enemy) && !isLevelTwoZombie(enemy) && !isLevelThreeSkeleton(enemy) && !isGoblinKingElite(enemy) && !isZombieKingElite(enemy)) return;

                enemyDeathEffects.push({
                    x: enemy.x,
                    y: enemy.y,
                    spriteSet: isGoblinKingElite(enemy) ? 'goblinKing' : isZombieKingElite(enemy) ? 'zombieKing' : isLevelThreeSkeleton(enemy) ? 'levelThree' : isLevelTwoZombie(enemy) ? 'zombie' : 'goblin',
                    size: isGoblinKingElite(enemy) || isZombieKingElite(enemy) ? 92 : isLevelThreeSkeleton(enemy) ? 70 : 54,
                    facing: enemy.facing || 1,
                    lifetime: 0.45,
                    maxLifetime: 0.45
                });
            }

            function isRelicUpgraded(relicName) {
                const upgradeKeys = {
                    'Vampire Mask': 'vampireMask',
                    'Hero Sword': 'heroSword',
                    'Red Mushroom': 'redMushroom',
                    'Gravity Glove': 'gravityGlove',
                    'Magic Shield': 'magicShield',
                    'Black Rod': 'blackRod',
                    'Ice Blade': 'iceBlade',
                    'Ice Staff': 'iceStaff',
                    'Ice Shield': 'iceShield',
                    'Fire Armor': 'fireArmor',
                    'Fire Staff': 'fireStaff',
                    'Fire Heart': 'fireHeart'
                };
                const key = upgradeKeys[relicName];
                return key ? !!player.relicUpgrades[key] : false;
            }

            function dropSpecificRelic(x, y, relicName) {
                pickups.push(createPickup({
                    x,
                    y,
                    type: 'relic',
                    relicName
                }));
            }

            // Activate relic effect
            function activateRelic(relicName) {
                player.relics.push(relicName);
                
                switch (relicName) {
                    case 'Red Mushroom':
                        player.maxHp += 20;
                        player.hp = Math.min(player.hp + 20, player.maxHp);
                        break;
                    case 'Magic Shield':
                        player.magicShieldMaxValue = 20;
                        player.magicShield = 20;
                        break;
                    case 'Ice Staff':
                        player.iceStaffTimer = 0;
                        break;
                    case 'Fire Armor':
                        player.maxHp += 20;
                        player.hp = Math.min(player.hp + 20, player.maxHp);
                        break;
                    case 'Fire Staff':
                        player.fireStaffTimer = 0;
                        break;
                }
            }

            // Add EXP to player and check for level-up
            function addExp(amount) {
                player.exp += amount;
                totalExpGained += amount;
                const requiredExp = getRequiredExp(player.level);
                
                if (player.exp >= requiredExp) {
                    player.exp -= requiredExp;
                    player.level += 1;
                    showLevelUpPanel();
                }
            }

            // Handle enemy death
            function killEnemy(enemy) {
                kills++;
                const isS1Elite = enemy.eliteId === 'S1';
                const isS2Elite = enemy.eliteId === 'S2';
                addEnemyDeathEffect(enemy);
                
                // Vampire Mask: recover HP on kill
                if (player.relics.includes('Vampire Mask')) {
                    const missingHpRatio = 1 - player.hp / player.maxHp;
                    const healPercent = player.relicUpgrades.vampireMask
                        ? lerp(0.1, 0.5, missingHpRatio)
                        : 0.1;
                    const healAmount = Math.max(1, Math.ceil(Math.min(enemy.maxHp * healPercent, player.relicUpgrades.vampireMask ? 20 : Infinity)));
                    const actualHeal = Math.min(healAmount, player.maxHp - player.hp);
                    player.hp = Math.min(player.hp + healAmount, player.maxHp);
                    if (actualHeal > 0) {
                        floatingTexts.push({
                            x: enemy.x,
                            y: enemy.y,
                            text: `+${Math.ceil(actualHeal)}`,
                            color: '#2ecc71',
                            lifetime: 0.3,
                            maxLifetime: 0.3
                        });
                    }
                }
                
                // Drop pickups
                if (isS1Elite) {
                    const relicName = S1_RELIC_NAMES[Math.floor(Math.random() * S1_RELIC_NAMES.length)];
                    dropSpecificRelic(enemy.x, enemy.y, relicName);
                } else if (isS2Elite) {
                    const relicName = S2_RELIC_NAMES[Math.floor(Math.random() * S2_RELIC_NAMES.length)];
                    dropSpecificRelic(enemy.x, enemy.y, relicName);
                } else {
                    dropPickup(enemy.x, enemy.y, enemy.maxHp, enemy.wave);
                }
            }

            // Find nearest enemy
            function findNearestEnemy() {
                let nearest = null;
                let nearestDist = Infinity;

                for (const enemy of enemies) {
                    const dx = enemy.x - player.x;
                    const dy = enemy.y - player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = enemy;
                    }
                }

                return nearest;
            }

            function findNearestEnemies(count) {
                return enemies
                    .map(enemy => {
                        const dx = enemy.x - player.x;
                        const dy = enemy.y - player.y;
                        return {
                            enemy,
                            dist: Math.sqrt(dx * dx + dy * dy)
                        };
                    })
                    .sort((a, b) => a.dist - b.dist)
                    .slice(0, count)
                    .map(item => item.enemy);
            }

            function createBlizzard(x, y) {
                blizzards.push({
                    x,
                    y,
                    radius: player.relicUpgrades.iceStaff ? 200 : 100,
                    lifetime: 3,
                    maxLifetime: 3,
                    tickTimer: 0,
                    angle: Math.random() * Math.PI * 2
                });
            }

            function createFireNode(x, y) {
                fireHazards.push({
                    x,
                    y,
                    radius: 150,
                    delay: 1.0,
                    maxDelay: 1.0
                });
            }

            function createFireExplosion(x, y, radius, damage) {
                fireExplosions.push({
                    x,
                    y,
                    radius,
                    lifetime: 0.45,
                    maxLifetime: 0.45
                });

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const dx = enemies[i].x - x;
                    const dy = enemies[i].y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= radius + ENEMY_RADIUS * (enemies[i].sizeScale || 1)) {
                        markEnemyHit(enemies[i]);
                        enemies[i].hp -= damage;
                        if (enemies[i].hp <= 0) {
                            killEnemy(enemies[i]);
                            enemies.splice(i, 1);
                        }
                    }
                }
            }

            function fireFireball(target) {
                const dx = target.x - player.x;
                const dy = target.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    bullets.push({
                        x: player.x,
                        y: player.y,
                        vx: (dx / dist) * config.bulletSpeed,
                        vy: (dy / dist) * config.bulletSpeed,
                        type: 'fireball',
                        big: player.relicUpgrades.fireStaff
                    });
                }
            }

            // Fire bullet at target
            function fireBullet(target) {
                const dx = target.x - player.x;
                const dy = target.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    playPlayerAction('attack');
                    const vx = (dx / dist) * config.bulletSpeed;
                    const vy = (dy / dist) * config.bulletSpeed;
                    const isCritical = Math.random() < player.criticalChance;
                    bullets.push({
                        x: player.x,
                        y: player.y,
                        vx,
                        vy,
                        isCritical,
                        type: 'normal'
                    });

                    // Limit bullets
                    if (bullets.length > MAX_BULLETS) {
                        bullets.shift();
                    }
                }
            }

            // Fire black rod at target
            function fireBlackRod(target) {
                const dx = target.x - player.x;
                const dy = target.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    const vx = (dx / dist) * config.bulletSpeed;
                    const vy = (dy / dist) * config.bulletSpeed;
                    bullets.push({
                        x: player.x,
                        y: player.y,
                        vx,
                        vy,
                        type: 'blackRod',
                        pierceCount: 0
                    });

                    if (bullets.length > MAX_BULLETS) {
                        bullets.shift();
                    }
                }
            }

            // Circle collision check
            function circleCollision(x1, y1, r1, x2, y2, r2) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return dist < r1 + r2;
            }

            function drawSpriteImage(sprite, x, y, size, facing = 1, alpha = 1, offsetY = 0) {
                if (!sprite || !sprite.complete || sprite.naturalWidth <= 0) return false;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(x, y + offsetY);
                ctx.scale(facing, 1);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
                ctx.restore();
                return true;
            }

            function hasIceStatus(enemy) {
                return (enemy.iceSlow || 0) > 0 || enemy.blizzardSlowTimer > 0 || enemy.slowTimer > 0;
            }

            function getEnemyStatusTints(enemy, includeHitFlash = true) {
                const tints = [];
                if (includeHitFlash && enemy.hurtTimer > 0) {
                    tints.push('rgba(255, 255, 255, 0.42)');
                    tints.push('rgba(255, 45, 45, 0.28)');
                }
                if (hasIceStatus(enemy)) {
                    tints.push('rgba(95, 210, 255, 0.32)');
                }
                if (enemy.fireBurnTimer > 0) {
                    const pulse = 0.22 + (Math.sin(gameTime * 18) + 1) * 0.08;
                    tints.push(`rgba(255, 92, 24, ${pulse})`);
                }
                if (enemy.bleedingTimer > 0) {
                    tints.push('rgba(150, 0, 30, 0.38)');
                }
                return tints;
            }

            const enemySpriteBuffer = document.createElement('canvas');
            const enemySpriteBufferCtx = enemySpriteBuffer.getContext('2d');

            function applyEnemyStatusTints(targetCtx, enemy, size, includeHitFlash = true) {
                const tints = getEnemyStatusTints(enemy, includeHitFlash);
                if (tints.length === 0) return;

                targetCtx.globalCompositeOperation = 'source-atop';
                for (const tint of tints) {
                    targetCtx.fillStyle = tint;
                    targetCtx.fillRect(0, 0, size, size);
                }
                targetCtx.globalCompositeOperation = 'source-over';
            }

            function renderEnemySpriteFrame(sprite, enemy, size, includeHitFlash = true) {
                const bufferSize = Math.ceil(size);
                if (enemySpriteBuffer.width !== bufferSize || enemySpriteBuffer.height !== bufferSize) {
                    enemySpriteBuffer.width = bufferSize;
                    enemySpriteBuffer.height = bufferSize;
                }

                enemySpriteBufferCtx.clearRect(0, 0, bufferSize, bufferSize);
                enemySpriteBufferCtx.imageSmoothingEnabled = false;
                enemySpriteBufferCtx.drawImage(sprite, 0, 0, bufferSize, bufferSize);
                applyEnemyStatusTints(enemySpriteBufferCtx, enemy, bufferSize, includeHitFlash);
                return enemySpriteBuffer;
            }

            function drawEnemyStatusParticles(enemy, radius) {
                ctx.save();
                ctx.lineCap = 'round';

                if (hasIceStatus(enemy)) {
                    ctx.fillStyle = 'rgba(205, 245, 255, 0.75)';
                    ctx.strokeStyle = 'rgba(120, 220, 255, 0.55)';
                    for (let i = 0; i < 6; i++) {
                        const angle = gameTime * 0.8 + i * Math.PI * 0.67;
                        const distance = radius * (0.62 + 0.16 * Math.sin(gameTime * 2 + i));
                        const x = enemy.x + Math.cos(angle) * distance;
                        const y = enemy.y + Math.sin(angle) * distance;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(x - 3, y);
                        ctx.lineTo(x + 3, y);
                        ctx.moveTo(x, y - 3);
                        ctx.lineTo(x, y + 3);
                        ctx.stroke();
                    }
                }

                if (enemy.fireBurnTimer > 0) {
                    for (let i = 0; i < 7; i++) {
                        const phase = (gameTime * 2.4 + i * 0.23) % 1;
                        const side = Math.sin(i * 12.9898) * 0.5 + 0.5;
                        const x = enemy.x + (side - 0.5) * radius * 1.25 + Math.sin(gameTime * 9 + i) * 2;
                        const y = enemy.y + radius * 0.48 - phase * radius * 1.4;
                        const alpha = 1 - phase;
                        ctx.fillStyle = `rgba(255, ${120 + i * 12}, 28, ${0.72 * alpha})`;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.6 + alpha * 1.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (enemy.bleedingTimer > 0) {
                    ctx.fillStyle = 'rgba(210, 20, 45, 0.76)';
                    for (let i = 0; i < 4; i++) {
                        const phase = (gameTime * 3 + i * 0.31) % 1;
                        const x = enemy.x + Math.sin(i * 7.41) * radius * 0.42;
                        const y = enemy.y + radius * (0.15 + phase * 0.55);
                        ctx.beginPath();
                        ctx.ellipse(x, y, 1.7, 2.8, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            function drawEnemySpriteImage(sprite, enemy, size, options = {}) {
                if (!sprite || !sprite.complete || sprite.naturalWidth <= 0) return false;

                const facing = enemy.facing || 1;
                const alpha = options.alpha ?? 1;
                const offsetX = options.offsetX || 0;
                const offsetY = options.offsetY || 0;
                const rotation = options.rotation || 0;
                const scaleX = options.scaleX || 1;
                const scaleY = options.scaleY || 1;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(enemy.x + offsetX, enemy.y + offsetY);
                ctx.rotate(rotation * facing);
                ctx.scale(facing * scaleX, scaleY);
                ctx.imageSmoothingEnabled = false;
                const renderedSprite = renderEnemySpriteFrame(sprite, enemy, size, options.includeHitFlash !== false);
                ctx.drawImage(renderedSprite, -size / 2, -size / 2, size, size);
                ctx.restore();

                drawEnemyStatusParticles(enemy, size * 0.45);
                return true;
            }

            function drawGoblinEnemy(enemy, enemyRadius) {
                const state = enemy.attackAnimTimer > 0
                    ? 'attack'
                    : enemy.hurtTimer > 0
                    ? 'hurt'
                    : enemy.isMoving
                        ? 'walk'
                        : 'idle';
                const sprite = goblinSprites[state] || goblinSprites.run || goblinSprites.idle;
                const size = Math.max(48, enemyRadius * 3.35);
                const bobOffset = state === 'walk' ? Math.sin(gameTime * 8 + enemy.x * 0.04) * 1.2 : 0;
                return drawEnemySpriteImage(sprite, enemy, size, { offsetY: bobOffset });
            }

            function drawZombieEnemy(enemy, enemyRadius) {
                const state = enemy.attackAnimTimer > 0
                    ? 'attack'
                    : enemy.hurtTimer > 0
                    ? 'hurt'
                    : enemy.isMoving
                        ? 'walk'
                        : 'idle';
                const sprite = zombieSprites[state] || zombieSprites.idle;
                const size = Math.max(50, enemyRadius * 3.45);
                const walkCycle = Math.sin(gameTime * 5 + enemy.x * 0.03);
                const bobOffset = state === 'walk' ? walkCycle * 0.8 : 0;
                const rotation = state === 'walk' ? walkCycle * 0.035 : 0;
                return drawEnemySpriteImage(sprite, enemy, size, {
                    offsetY: bobOffset,
                    rotation
                });
            }

            function drawLevelThreeEnemy(enemy, enemyRadius) {
                const isHurt = enemy.hurtTimer > 0;
                const isAttacking = enemy.attackAnimTimer > 0;
                const state = isAttacking ? 'attack' : enemy.isMoving ? 'walk' : 'idle';
                const walkFrame = Math.floor((gameTime * 5.4 + enemy.x * 0.015) % 2);
                const attackProgress = isAttacking ? 1 - enemy.attackAnimTimer / 0.22 : 0;
                const attackFrame = Math.min(2, Math.max(0, Math.floor(attackProgress * 3)));
                const sprite = isHurt && getSpriteFrame(levelThreeSprites.hurt, 0)
                    ? getSpriteFrame(levelThreeSprites.hurt, 0)
                    : state === 'attack'
                    ? getSpriteFrame(levelThreeSprites.attack, attackFrame)
                    : state === 'walk'
                    ? getSpriteFrame(levelThreeSprites.walk, walkFrame)
                    : levelThreeSprites.idle;
                const fallbackSprite = sprite || levelThreeSprites.idle || zombieSprites.idle;
                const size = Math.max(70, enemyRadius * 3.35);
                const walkCycle = Math.sin(gameTime * 6 + enemy.x * 0.025);
                const isWalking = state === 'walk';
                const hurtShake = isHurt ? Math.sin(gameTime * 90) * 2 : 0;

                return drawEnemySpriteImage(fallbackSprite, enemy, size, {
                    offsetX: hurtShake,
                    offsetY: isWalking ? walkCycle * 1.0 : 0,
                    rotation: isWalking ? walkCycle * 0.025 : 0,
                    scaleX: isWalking ? 1 - Math.abs(walkCycle) * 0.012 : 1,
                    scaleY: isWalking ? 1 + Math.abs(walkCycle) * 0.018 : 1
                });
            }

            function drawGoblinKingSprite(sprite, enemy, size, options = {}) {
                return drawEnemySpriteImage(sprite, enemy, size, options);
            }

            function getSpriteFrame(frames, index) {
                if (Array.isArray(frames)) {
                    if (frames.length === 0) return null;
                    return frames[index % frames.length];
                }
                return frames;
            }

            function drawGoblinKingEnemy(enemy, enemyRadius) {
                const isHurt = enemy.hurtTimer > 0;
                const isAttacking = enemy.attackAnimTimer > 0;
                const state = isAttacking ? 'attack' : enemy.isMoving ? 'walk' : 'idle';
                const walkFrame = Math.floor((gameTime * 7 + enemy.x * 0.02) % 2);
                const attackProgress = isAttacking ? 1 - enemy.attackAnimTimer / 0.22 : 0;
                const attackFrame = Math.min(2, Math.max(0, Math.floor(attackProgress * 3)));
                const sprite = isHurt && getSpriteFrame(goblinKingSprites.hurt, 0)
                    ? getSpriteFrame(goblinKingSprites.hurt, 0)
                    : state === 'attack'
                    ? getSpriteFrame(goblinKingSprites.attack, attackFrame)
                    : state === 'walk'
                    ? getSpriteFrame(goblinKingSprites.walk, walkFrame)
                    : goblinKingSprites.idle;
                const fallbackSprite = sprite || goblinKingSprites.idle || getSpriteFrame(goblinSprites[state], 0) || goblinSprites.idle;
                const size = Math.max(88, enemyRadius * 3.05);
                const walkCycle = Math.sin(gameTime * 11 + enemy.x * 0.035);
                const isWalking = state === 'walk';
                const hurtShake = isHurt ? Math.sin(gameTime * 90) * 2 : 0;

                return drawGoblinKingSprite(fallbackSprite, enemy, size, {
                    offsetX: hurtShake,
                    offsetY: isWalking ? walkCycle * 2.2 : 0,
                    rotation: isWalking ? walkCycle * 0.075 : 0,
                    scaleX: isWalking ? 1 - Math.abs(walkCycle) * 0.035 : 1,
                    scaleY: isWalking ? 1 + Math.abs(walkCycle) * 0.045 : 1,
                    tint: isHurt ? 'rgba(255, 45, 45, 0.5)' : null
                });
            }

            function drawZombieKingEnemy(enemy, enemyRadius) {
                const isHurt = enemy.hurtTimer > 0;
                const isAttacking = enemy.attackAnimTimer > 0;
                const state = isAttacking ? 'attack' : enemy.isMoving ? 'walk' : 'idle';
                const walkFrame = Math.floor((gameTime * 5 + enemy.x * 0.018) % 2);
                const attackProgress = isAttacking ? 1 - enemy.attackAnimTimer / 0.22 : 0;
                const attackFrame = Math.min(2, Math.max(0, Math.floor(attackProgress * 3)));
                const sprite = isHurt && getSpriteFrame(zombieKingSprites.hurt, 0)
                    ? getSpriteFrame(zombieKingSprites.hurt, 0)
                    : state === 'attack'
                    ? getSpriteFrame(zombieKingSprites.attack, attackFrame)
                    : state === 'walk'
                    ? getSpriteFrame(zombieKingSprites.walk, walkFrame)
                    : zombieKingSprites.idle;
                const fallbackSprite = sprite || zombieKingSprites.idle || zombieSprites.idle;
                const size = Math.max(92, enemyRadius * 3.05);
                const walkCycle = Math.sin(gameTime * 7 + enemy.x * 0.03);
                const isWalking = state === 'walk';
                const hurtShake = isHurt ? Math.sin(gameTime * 90) * 2 : 0;

                return drawEnemySpriteImage(fallbackSprite, enemy, size, {
                    offsetX: hurtShake,
                    offsetY: isWalking ? walkCycle * 1.6 : 0,
                    rotation: isWalking ? walkCycle * 0.045 : 0,
                    scaleX: isWalking ? 1 - Math.abs(walkCycle) * 0.025 : 1,
                    scaleY: isWalking ? 1 + Math.abs(walkCycle) * 0.03 : 1
                });
            }

            function triggerMagicShieldBreak() {
                const radius = 300;
                const shardCount = 18;
                const shards = [];
                for (let i = 0; i < shardCount; i++) {
                    const angle = (Math.PI * 2 * i) / shardCount + (Math.random() - 0.5) * 0.25;
                    shards.push({
                        angle,
                        speed: 160 + Math.random() * 170,
                        size: 4 + Math.random() * 5,
                        spin: (Math.random() - 0.5) * 8
                    });
                }
                shieldBreakEffects.push({
                    x: player.x,
                    y: player.y,
                    radius,
                    lifetime: 0.55,
                    maxLifetime: 0.55,
                    shards
                });

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const dx = enemies[i].x - player.x;
                    const dy = enemies[i].y - player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= radius) {
                        enemies[i].hp -= 10;
                        enemies[i].slowTimer = Math.max(enemies[i].slowTimer || 0, 3);
                        enemies[i].slowAmount = 0.5;
                        if (enemies[i].hp <= 0 && !enemies[i].pendingDeath) {
                            enemies[i].pendingDeath = true;
                            killEnemy(enemies[i]);
                        }
                    }
                }
            }

            function triggerIceBladeBurst(sourceEnemy) {
                const radius = 100;
                const shardCount = 14;
                const shards = [];
                for (let i = 0; i < shardCount; i++) {
                    const angle = (Math.PI * 2 * i) / shardCount + (Math.random() - 0.5) * 0.35;
                    shards.push({
                        angle,
                        speed: 130 + Math.random() * 140,
                        size: 3 + Math.random() * 4,
                        spin: (Math.random() - 0.5) * 7
                    });
                }
                shieldBreakEffects.push({
                    x: sourceEnemy.x,
                    y: sourceEnemy.y,
                    radius,
                    lifetime: 0.45,
                    maxLifetime: 0.45,
                    shards
                });

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    if (enemy === sourceEnemy) continue;
                    const dx = enemy.x - sourceEnemy.x;
                    const dy = enemy.y - sourceEnemy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= radius) {
                        enemy.hp -= 1;
                        const hadActiveSlow = enemy.slowTimer > 0;
                        enemy.slowTimer = Math.max(enemy.slowTimer || 0, 2);
                        enemy.slowAmount = hadActiveSlow
                            ? Math.max(enemy.slowAmount || 0, 0.4)
                            : 0.4;
                        if (enemy.hp <= 0 && !enemy.pendingDeath) {
                            enemy.pendingDeath = true;
                            killEnemy(enemy);
                        }
                    }
                }
            }

            function canUseRedMushroomRevive() {
                return false;
            }

            function useRedMushroomRevive() {
                if (!canUseRedMushroomRevive()) return false;

                    player.redMushroomReviveUsed = true;
                    player.redMushroomReviveAvailable = false;
                    player.hp = Math.max(1, Math.ceil(player.maxHp * 0.2));
                    player.invulnerableTimer = INVULNERABILITY_TIME * 2;
                    playPlayerAction('hurt');
                    floatingTexts.push({
                        x: player.x,
                        y: player.y - PLAYER_RADIUS,
                        text: 'REVIVE',
                        color: '#ff6b9d',
                        lifetime: 0.8,
                        maxLifetime: 0.8
                    });
                return true;
            }

            function tryReviveOrDie() {
                if (player.hp > 0) return false;

                if (useRedMushroomRevive()) return false;

                player.hp = 0;
                playPlayerAction('death');
                triggerGameOver(false);
                return true;
            }

            // Game over
            function triggerGameOver(isVictory = false) {
                if (!isVictory && player.hp <= 0 && useRedMushroomRevive()) {
                    return;
                }

                gameState = 'gameover';
                if (!isVictory) {
                    playPlayerAction('death');
                    playerVisualActionElapsed = PLAYER_ACTIONS.death.duration;
                }
                const survivalTime = formatTime(gameTime);
                const resultText = isVictory ? 'VICTORY' : 'GAME OVER';
                const resultColor = isVictory ? '#2ecc71' : '#ff4757';
                
                gameOverEl.classList.add('visible');
                gameOverEl.querySelector('.game-over-title').textContent = resultText;
                gameOverEl.querySelector('.game-over-title').style.color = resultColor;
                gameOverEl.querySelector('.game-over-title').style.textShadow = `0 0 30px ${resultColor}, 0 4px 12px rgba(0,0,0,0.5)`;
                
                const statsHtml = `
                    <div style="color: #ffffff; font-size: 18px; text-align: center; line-height: 1.8;">
                        <div>Survival Time: <span style="color: #ffd700; font-weight: 700;">${survivalTime}</span></div>
                        <div>Final Level: <span style="color: #ffd700; font-weight: 700;">${player.level}</span></div>
                        <div>Total Kills: <span style="color: #ffd700; font-weight: 700;">${kills}</span></div>
                        <div>Total EXP: <span style="color: #ffd700; font-weight: 700;">${totalExpGained}</span></div>
                    </div>
                `;
                
                const statsEl = gameOverEl.querySelector('.final-score');
                statsEl.innerHTML = statsHtml;
                finalKillsEl.textContent = kills;
            }

            function playPlayerAction(action) {
                const settings = PLAYER_ACTIONS[action];
                const sprite = playerActionSprites[action];
                if (!settings || !sprite || !sprite.complete || sprite.naturalWidth <= 0) return;

                if (playerVisualAction === 'death') return;
                playerVisualAction = action;
                playerVisualActionElapsed = 0;
                playerVisualActionDuration = settings.duration;
            }

            function updatePlayerVisualAction(dt) {
                if (!playerVisualAction) return;

                playerVisualActionElapsed += dt;
                if (playerVisualActionElapsed >= playerVisualActionDuration) {
                    playerVisualAction = null;
                    playerVisualActionElapsed = 0;
                    playerVisualActionDuration = 0;
                }
            }

            function getPlayerActionFrame(action) {
                const sprite = playerActionSprites[action];
                const settings = PLAYER_ACTIONS[action];
                if (!sprite || !settings || sprite.naturalWidth <= 0 || sprite.naturalHeight <= 0) {
                    return null;
                }

                const frameSize = sprite.naturalHeight;
                const frameCount = Math.max(1, Math.floor(sprite.naturalWidth / frameSize));
                let frameIndex = Math.floor(playerVisualActionElapsed * settings.fps);
                if (settings.loop) {
                    frameIndex %= frameCount;
                } else {
                    frameIndex = Math.min(frameCount - 1, frameIndex);
                }

                return {
                    image: sprite,
                    sx: frameIndex * frameSize,
                    sy: 0,
                    sw: frameSize,
                    sh: frameSize
                };
            }

            // Input handlers
            function handleKeyDown(e) {
                if (mode === 'edit') return;
                
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        keys.up = true;
                        e.preventDefault();
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        keys.down = true;
                        e.preventDefault();
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        keys.left = true;
                        e.preventDefault();
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        keys.right = true;
                        e.preventDefault();
                        break;
                }
            }

            function handleKeyUp(e) {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        keys.up = false;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        keys.down = false;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        keys.left = false;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        keys.right = false;
                        break;
                }
            }

            function handleTouchStart(e) {
                if (mode === 'edit') return;
                
                for (const touch of e.changedTouches) {
                    const rect = canvas.getBoundingClientRect();
                    const touchX = touch.clientX - rect.left;
                    const touchY = touch.clientY - rect.top;
                    const gamePos = screenToGame(touchX, touchY);

                    // Only activate joystick in lower half of screen
                    if (gamePos.y > ARENA_HEIGHT / 2 && !joystick.active) {
                        joystick.active = true;
                        joystick.touchId = touch.identifier;
                        joystick.baseX = gamePos.x;
                        joystick.baseY = gamePos.y;
                        joystick.stickX = gamePos.x;
                        joystick.stickY = gamePos.y;
                        joystick.dx = 0;
                        joystick.dy = 0;
                    }
                }
                e.preventDefault();
            }

            function handleTouchMove(e) {
                if (mode === 'edit') return;
                
                for (const touch of e.changedTouches) {
                    if (touch.identifier === joystick.touchId && joystick.active) {
                        const rect = canvas.getBoundingClientRect();
                        const touchX = touch.clientX - rect.left;
                        const touchY = touch.clientY - rect.top;
                        const gamePos = screenToGame(touchX, touchY);

                        let dx = gamePos.x - joystick.baseX;
                        let dy = gamePos.y - joystick.baseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        // Reposition base if beyond max radius
                        if (dist > JOYSTICK_MAX_RADIUS) {
                            const angle = Math.atan2(dy, dx);
                            joystick.baseX = gamePos.x - Math.cos(angle) * JOYSTICK_MAX_RADIUS;
                            joystick.baseY = gamePos.y - Math.sin(angle) * JOYSTICK_MAX_RADIUS;
                            dx = gamePos.x - joystick.baseX;
                            dy = gamePos.y - joystick.baseY;
                        }

                        joystick.stickX = gamePos.x;
                        joystick.stickY = gamePos.y;

                        // Calculate normalized direction with dead zone
                        const magnitude = Math.sqrt(dx * dx + dy * dy);
                        if (magnitude > JOYSTICK_DEAD_ZONE) {
                            joystick.dx = dx / JOYSTICK_MAX_RADIUS;
                            joystick.dy = dy / JOYSTICK_MAX_RADIUS;
                        } else {
                            joystick.dx = 0;
                            joystick.dy = 0;
                        }
                    }
                }
                e.preventDefault();
            }

            function handleTouchEnd(e) {
                for (const touch of e.changedTouches) {
                    if (touch.identifier === joystick.touchId) {
                        joystick.active = false;
                        joystick.touchId = null;
                        joystick.dx = 0;
                        joystick.dy = 0;
                    }
                }
                e.preventDefault();
            }

            function handleBlur() {
                keys = { up: false, down: false, left: false, right: false };
                joystick.active = false;
                joystick.dx = 0;
                joystick.dy = 0;
            }

            // Set up event listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });
            window.addEventListener('blur', handleBlur);

            restartBtn.addEventListener('click', () => {
                if (mode === 'play') {
                    initGame();
                }
            });


            // Update game logic
            function update(dt) {
                if (mode === 'edit' || gameState === 'gameover' || gameState === 'levelup') return;

                // Clamp delta time to prevent large jumps
                dt = Math.min(dt, 0.11);

                // Update game time
                gameTime += dt;
                updatePlayerVisualAction(dt);

                // Check if time is up (victory condition)
                if (gameTime >= GAME_DURATION) {
                    gameTime = GAME_DURATION;
                    triggerGameOver(true); // Victory!
                    return;
                }

                // Spawn S1 elite at the end of the first minute.
                if (gameTime >= 60 && !spawnedElites.has('S1')) {
                    spawnS1Elite();
                }
                if (gameTime >= 120 && !spawnedElites.has('S2')) {
                    spawnS2Elite();
                }

                // Calculate player movement direction
                let moveX = 0;
                let moveY = 0;

                // Keyboard input
                if (keys.up) moveY -= 1;
                if (keys.down) moveY += 1;
                if (keys.left) moveX -= 1;
                if (keys.right) moveX += 1;

                // Joystick input (overrides keyboard if active)
                if (joystick.active) {
                    moveX = joystick.dx;
                    moveY = joystick.dy;
                }

                // Normalize diagonal movement
                const moveMag = Math.sqrt(moveX * moveX + moveY * moveY);
                if (moveMag > 1) {
                    moveX /= moveMag;
                    moveY /= moveMag;
                }

                // Track if player is moving for Hero Sword
                const isMoving = moveMag > 0.1;
                player.vx = isMoving ? moveX : 0;
                player.vy = isMoving ? moveY : 0;

                // Apply movement
                player.x += moveX * config.playerSpeed * dt;
                player.y += moveY * config.playerSpeed * dt;

                // Clamp to arena bounds
                player.x = Math.max(PLAYER_RADIUS, Math.min(ARENA_WIDTH - PLAYER_RADIUS, player.x));
                player.y = Math.max(PLAYER_RADIUS, Math.min(ARENA_HEIGHT - PLAYER_RADIUS, player.y));

                // Update invulnerability timer
                if (player.invulnerableTimer > 0) {
                    player.invulnerableTimer -= dt;
                }

                // Update magic shield regeneration
                if (player.relics.includes('Magic Shield')) {
                    if (gameTime - player.lastDamageTime >= 3) {
                        player.magicShield = Math.min(player.magicShield + dt, player.magicShieldMaxValue);
                    }
                }

                if (player.fireArmorHasteTimer > 0) {
                    player.fireArmorHasteTimer -= dt;
                }

                // Hero Sword charging
                if (player.relics.includes('Hero Sword')) {
                    const chargeConfig = getHeroSwordChargeConfig();
                    if (isMoving) {
                        // Player moved, trigger slash if charged enough
                        if (player.heroSwordChargeTime >= chargeConfig.min) {
                            triggerHeroSwordSlash();
                        }
                        player.heroSwordChargeTime = 0;
                    } else {
                        // Player not moving, charge
                        player.heroSwordChargeTime = Math.min(player.heroSwordChargeTime + dt, chargeConfig.max);
                    }
                }

                // Black Rod auto-fire
                if (player.relics.includes('Black Rod')) {
                    player.blackRodTimer += dt;
                    if (player.blackRodTimer >= 3.0 && enemies.length > 0) {
                        player.blackRodTimer = 0;
                        if (player.relicUpgrades.blackRod) {
                            for (const target of findNearestEnemies(3)) {
                                fireBlackRod(target);
                            }
                        } else {
                            const target = findNearestEnemy();
                            if (target) {
                                fireBlackRod(target);
                            }
                        }
                    }
                }

                if (player.relics.includes('Ice Staff')) {
                    player.iceStaffTimer += dt;
                    if (player.iceStaffTimer >= 3.0 && enemies.length > 0) {
                        player.iceStaffTimer = 0;
                        const target = findNearestEnemy();
                        if (target) {
                            createBlizzard(target.x, target.y);
                        }
                    }
                }

                if (player.relics.includes('Fire Staff')) {
                    player.fireStaffTimer += dt;
                    if (player.fireStaffTimer >= 2.0 && enemies.length > 0) {
                        player.fireStaffTimer = 0;
                        const target = findNearestEnemy();
                        if (target) {
                            fireFireball(target);
                        }
                    }
                }

                if (player.relics.includes('Fire Heart') && gameTime - player.lastDamageTime >= 3) {
                    player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.02 * dt);
                }

                // Enemy spawning with wave-scaled interval
                const wave = getCurrentWave();
                const stats = getEnemyStats(wave);
                spawnTimer += dt;
                if (spawnTimer >= stats.spawnInterval) {
                    spawnTimer -= stats.spawnInterval;
                    spawnEnemy();
                }

                // Auto-fire
                player.fireTimer += dt;
                if (player.fireTimer >= getFireRateInterval() && enemies.length > 0) {
                    player.fireTimer = 0;
                    const target = findNearestEnemy();
                    if (target) {
                        fireBullet(target);
                    }
                }

                // Update enemies
                for (const enemy of enemies) {
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const attackRange = enemy.attackRange || NORMAL_ENEMY_ATTACK_RANGE;
                    enemy.isMoving = false;
                    enemy.facing = getEnemyFacingTowardPlayer(enemy, dx);
                    if (dist > attackRange && dist > 0) {
                        enemy.isMoving = true;
                        const shouldChasePlayer = dist <= ENEMY_CHASE_RADIUS || enemy.y >= player.y - ENEMY_CHASE_RADIUS * 0.35;
